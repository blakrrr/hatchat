<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hatchat - Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">hatchat - 1.0.0.7</div>
        <nav>
            <ul>
                <!-- clips sits to the left of homepage, as requested -->
                <li><a href="clips.html">clips</a></li>
                <li><a href="index.html">homepage</a></li>
                <li><a href="chat.html">hatchat</a></li>
                <li><a href="settings.html">settings</a></li>
            </ul>
        </nav>
    </header>

    <div class="load-more-container">
        <button id="load-more-btn" class="load-more-btn">Load Earlier Messages</button>
    </div>

    <div class="main-content">
        <div class="user-list">
            <div class="dnd-toggle-container">
                <label>
                    <input type="checkbox" id="dnd-toggle"> Do Not Disturb
                </label>
            </div>
            <h3>fellow hattingtons</h3>
            <div class="online-users" id="online-users"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h2>Live Chat</h2>
                <p id="connection-status">Connecting...</p>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="loading-indicator" id="loading-indicator"></div>
            </div>

            <!-- Reply preview bar — hidden until a user clicks ↩ on a message -->
            <div class="reply-preview" id="reply-preview">
                <span class="reply-preview-label">↩ replying to</span>
                <span class="reply-preview-text" id="reply-preview-text"></span>
                <button class="reply-cancel-btn" id="reply-cancel-btn" title="Cancel reply">✕</button>
            </div>

            <form class="chat-form" id="chat-form">
                <input type="text" class="chat-input" id="chat-input"
                       placeholder="Type your message..." autocomplete="off">
                <label for="image-upload" class="upload-btn">
                    <span class="upload-icon">📷</span>
                </label>
                <input type="file" id="image-upload" accept="image/*" style="display:none">
                <button type="submit" class="chat-button">Send</button>
            </form>
        </div>
    </div>

    <!-- Username Modal -->
    <div class="modal" id="username-modal">
        <div class="modal-content">
            <h2>Enter Your Username</h2>
            <form id="username-form">
                <div class="form-group">
                    <label for="username-input">Username:</label>
                    <input type="text" class="form-input" id="username-input"
                           placeholder="Your username" required>
                </div>
                <div class="form-group">
                    <label for="color-input">Message Color:</label>
                    <input type="color" class="form-input" id="color-input" value="#FFFFFF">
                </div>
                <button type="submit" class="form-button">Join Chat</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script>
    // ── State ──────────────────────────────────────────────────────────────
    let username       = '';
    let socket;
    let currentPage    = 1;
    let isLoading      = false;
    let lastMessageSender = null;
    let selectedImage  = null;
    let isUploading    = false;
    let isDndEnabled   = false;
    let userColors     = {};

    // replyingTo holds the message the user wants to reply to.
    // Shape: { username, message, color }   — or null when not replying.
    let replyingTo = null;

    // ── DOM refs ──────────────────────────────────────────────────────────
    const chatMessages    = document.getElementById('chat-messages');
    const chatForm        = document.getElementById('chat-form');
    const chatInput       = document.getElementById('chat-input');
    const onlineUsers     = document.getElementById('online-users');
    const usernameModal   = document.getElementById('username-modal');
    const usernameForm    = document.getElementById('username-form');
    const usernameInput   = document.getElementById('username-input');
    const connectionStatus = document.getElementById('connection-status');
    const loadMoreBtn     = document.getElementById('load-more-btn');
    const loadingIndicator = document.getElementById('loading-indicator');
    const colorInput      = document.getElementById('color-input');
    const dndToggle       = document.getElementById('dnd-toggle');
    const replyPreview    = document.getElementById('reply-preview');
    const replyPreviewText = document.getElementById('reply-preview-text');
    const replyCancelBtn  = document.getElementById('reply-cancel-btn');
    const notificationSound = new Audio();

    // ── Emoji map ─────────────────────────────────────────────────────────
    const emojiMap = {
        ':smile:'           : '🙂',
        ':heart:'           : '❤️',
        ':tongue:'          : '👅',
        ':green_square:'    : '🟩',
        ':anatomical_heart:': '🫀 (ANATOMICAL HEART!!!)',
        ':locomotive:'      : '🚂',
        ':train:'           : '🚂',
        ':horse:'           : '🐎',
        ':fish:'            : '🐟',
        ':nerd:'            : '🤓'
    };

    function replaceEmojis(text) {
        return text.replace(/:\w+:/g, match => emojiMap[match] || match);
    }

    // ── Reply helpers ─────────────────────────────────────────────────────
    // setReply is called when the user clicks ↩ on any message.
    // We store the target message's data and show the preview bar.
    function setReply(data) {
        replyingTo = data; // { username, message, color }
        const preview = data.message
            ? `${data.username}: ${data.message.substring(0, 80)}${data.message.length > 80 ? '…' : ''}`
            : `${data.username}: [image]`;
        replyPreviewText.textContent = preview;
        replyPreview.style.display = 'flex';
        chatInput.focus();
    }

    function clearReply() {
        replyingTo = null;
        replyPreview.style.display = 'none';
        replyPreviewText.textContent = '';
    }

    replyCancelBtn.addEventListener('click', clearReply);

    // ── Timestamp formatter ───────────────────────────────────────────────
    function formatTimestamp(timestamp) {
        return new Date(timestamp).toLocaleString();
    }

    // ── Init on page load ─────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
        const storedUsername = localStorage.getItem('chat_username');
        const storedColor    = localStorage.getItem('chat_color') || '#FFFFFF';

        if (storedUsername) {
            username = storedUsername;
            if (colorInput) colorInput.value = storedColor;
            initializeChat(storedColor);
        } else {
            usernameModal.style.display = 'flex';
        }
    });

    usernameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const entered = usernameInput.value.trim();
        if (entered.length > 8) { alert('Username must be 8 characters or less.'); return; }
        if (!entered) return;

        username = entered;
        const selectedColor = document.getElementById('color-input').value;
        localStorage.setItem('chat_username', username);
        localStorage.setItem('chat_color', selectedColor);
        usernameModal.style.display = 'none';
        initializeChat(selectedColor);
    });

    // ── Chat initialisation ───────────────────────────────────────────────
    function initializeChat(selectedColor) {
        socket = io(window.location.origin, {
            query: { username, color: selectedColor },
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        // ── Incoming chat message ────────────────────────────────────────
        socket.on('chat_message', (data) => {
            displayMessage(data.username, data.message, data.timestamp,
                           data.color, data.image, data.replyTo);
            if (data.image) socket.emit('image_posted');
        });

        socket.on('scroll_to_latest', () => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // ── Connection events ────────────────────────────────────────────
        socket.on('connect', () => {
            connectionStatus.textContent = 'Connected';
            connectionStatus.style.color = '#4CAF50';
            socket.emit('user_join', { username });
            loadMessages(1);
        });

        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.style.color = '#ff6b6b';
        });

        // ── Message history ──────────────────────────────────────────────
        socket.on('chat_history', (data) => {
            loadingIndicator.style.display = 'none';
            isLoading = false;

            if (data.userColors) userColors = data.userColors;

            if (currentPage === 1) {
                chatMessages.innerHTML = '';
                lastMessageSender = null;
            }

            const messagesArray = [];

            data.messages.forEach((msg, index) => {
                if (msg.type === 'system') {
                    messagesArray.push(createSystemMessageElement(msg.message, msg.timestamp));
                    lastMessageSender = null;
                } else {
                    // A message with a reply is always shown as a non-continuation
                    // so the sender header is always visible above the quote block.
                    let isContinuation = false;
                    if (currentPage > 1 && index > 0 && !msg.replyTo) {
                        const prev = data.messages[index - 1];
                        isContinuation = prev.type !== 'system' && prev.username === msg.username;
                    }
                    const msgColor = msg.color || userColors[msg.username];
                    messagesArray.push(
                        createMessageElement(msg.username, msg.message, msg.timestamp,
                                             isContinuation, msgColor, msg.image, msg.replyTo)
                    );
                }
            });

            // For the first page the server sends newest→oldest, so we reverse.
            if (currentPage === 1) {
                messagesArray.reverse();
                recalcContinuations(messagesArray);

                // Track last sender for future incoming messages
                for (let i = messagesArray.length - 1; i >= 0; i--) {
                    const el = messagesArray[i];
                    if (!el.classList.contains('system-message')) {
                        const sEl = el.querySelector('.message-sender');
                        if (sEl) { lastMessageSender = sEl.getAttribute('data-sender'); break; }
                    }
                }
            } else {
                recalcContinuations(messagesArray);
            }

            const fragment = document.createDocumentFragment();
            messagesArray.forEach(el => fragment.appendChild(el));

            if (currentPage === 1) {
                chatMessages.appendChild(fragment);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                chatMessages.insertBefore(fragment, chatMessages.firstChild);
            }

            loadMoreBtn.disabled = (data.messages.length < 20);
        });

        // ── User events ──────────────────────────────────────────────────
        socket.on('user_join', (data) => {
            displaySystemMessage(`${data.username} has joined the chat`, new Date().toISOString());
            if (data.userColors) userColors = data.userColors;
            updateOnlineUsers(data.users);
        });

        socket.on('user_leave', (data) => {
            displaySystemMessage(`${data.username} has left the chat`, new Date().toISOString());
            if (data.userColors) userColors = data.userColors;
            updateOnlineUsers(data.users);
        });

        socket.on('update_users',  (data) => updateOnlineUsers(data.users));

        socket.on('update_colors', (data) => {
            if (data.userColors) {
                userColors = data.userColors;
                updateDisplayedColors();
            }
        });

        // ── UI controls ──────────────────────────────────────────────────
        loadMoreBtn.addEventListener('click', () => {
            if (!isLoading) { currentPage++; loadMessages(currentPage); }
        });

        document.getElementById('color-input').addEventListener('change', (e) => {
            socket.emit('update_color', { color: e.target.value });
        });

        dndToggle.addEventListener('change', () => {
            isDndEnabled = dndToggle.checked;
            if (socket) socket.emit('dnd_toggle', isDndEnabled);
        });

        // ── Image upload setup ───────────────────────────────────────────
        setupImageUpload();

        // ── Clipboard paste (images) ─────────────────────────────────────
        chatInput.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    if (file.size > 5 * 1024 * 1024) { alert('Pasted image is too large. Max 5MB.'); return; }
                    selectedImage = file;
                    chatInput.placeholder = 'Image pasted. Type a message (optional) and press send.';
                    showImagePreview(file);
                    e.preventDefault();
                    return;
                }
            }
        });
    }

    // ── Recalculate continuation markers on a batch of DOM elements ───────
    // Called after sorting / reversing so the "continued-message" CSS class
    // (which hides the sender label) is only applied when the same person
    // sends multiple messages in a row, and NOT when there's a replyTo block.
    function recalcContinuations(elements) {
        // Groups consecutive messages from the same sender as "continuations"
        // (username hidden on 2nd+ messages in a run).
        // Rules that BREAK a group and force the username to show again:
        //   1. Different sender
        //   2. A system message (join/leave) in between
        //   3. A reply quote (needs sender context)
        //   4. Time gap > 5 minutes between consecutive messages
        const GAP_MS = 5 * 60 * 1000; // 5 minutes
        let prevSender = null;
        let prevTs     = null;
        elements.forEach(el => {
            if (el.classList.contains('system-message')) {
                prevSender = null; prevTs = null; return;
            }
            const sEl = el.querySelector('.message-sender');
            const hasReply = el.querySelector('.reply-quote');
            if (!sEl) return;

            const sender  = sEl.getAttribute('data-sender');
            const tsRaw   = el.getAttribute('data-ts');
            const ts      = tsRaw ? parseInt(tsRaw, 10) : null;

            // Check if this message continues the previous run
            const sameUser  = prevSender === sender;
            const smallGap  = (ts && prevTs) ? (ts - prevTs) < GAP_MS : true;
            const isCont    = sameUser && smallGap && !hasReply;

            if (isCont) {
                el.classList.add('continued-message');
                const ua = el.querySelector('.username-area');
                if (ua) ua.innerHTML = '';
            } else {
                el.classList.remove('continued-message');
            }

            prevSender = sender;
            prevTs     = ts || prevTs;
        });
    }

    // ── Load messages from server ─────────────────────────────────────────
    function loadMessages(page) {
        if (isLoading) return;
        isLoading = true;
        loadingIndicator.style.display = 'flex';
        socket.emit('load_messages', { page });
    }

    // ── Image upload form handler ─────────────────────────────────────────
    // IMPORTANT: This is the ONE AND ONLY submit handler.
    // The original code had two — a bug that fired every send twice.
    // This version handles text, images, emojis, and replies together.
    function setupImageUpload() {
        const imageUpload = document.getElementById('image-upload');

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('Please select an image file.'); imageUpload.value = ''; return; }
            if (file.size > 5 * 1024 * 1024) { alert('Image must be under 5 MB.'); imageUpload.value = ''; return; }
            selectedImage = file;
            chatInput.placeholder = `Image "${file.name}" selected. Type a message (optional) and send.`;
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Replace emoji shortcodes in the typed text
            let message = replaceEmojis(chatInput.value.trim());

            if (!message && !selectedImage) return;
            if (!socket || isUploading) return;

            // Snapshot the current reply target before we might clear it
            const currentReply = replyingTo ? { ...replyingTo } : null;

            if (selectedImage) {
                // ── Image path ──────────────────────────────────────────
                isUploading = true;

                const loader = document.createElement('div');
                loader.className = 'image-loader';
                chatForm.appendChild(loader);

                const formData = new FormData();
                formData.append('image', selectedImage);

                try {
                    const response = await fetch(window.location.origin + '/upload', {
                        method: 'POST',
                        body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });

                    if (!response.ok) throw new Error(`Server ${response.status}: ${response.statusText}`);

                    const ct = response.headers.get('content-type');
                    if (!ct || !ct.includes('application/json')) throw new Error('Server did not return JSON');

                    const result = await response.json();

                    if (result.success) {
                        let imagePath = result.filePath;
                        if (imagePath && !imagePath.startsWith('http')) {
                            imagePath = window.location.origin +
                                        (imagePath.startsWith('/') ? '' : '/') + imagePath;
                        }
                        socket.emit('chat_message', { message, image: imagePath, replyTo: currentReply });
                    } else {
                        alert('Upload failed: ' + (result.message || 'unknown error'));
                    }
                } catch (err) {
                    alert('Upload error: ' + (err.message || err));
                } finally {
                    isUploading  = false;
                    selectedImage = null;
                    chatInput.placeholder = 'Type your message...';
                    chatForm.removeChild(loader);
                }

            } else {
                // ── Text-only path ──────────────────────────────────────
                socket.emit('chat_message', { message, replyTo: currentReply });
            }

            // Clear input and reply state
            chatInput.value = '';
            document.getElementById('image-upload').value = '';
            chatInput.focus();
            clearReply();
        });
    }

    // ── Create a message element ──────────────────────────────────────────
    // replyTo shape: { username, message, color } | null
    function createMessageElement(sender, message, timestamp,
                                  isContinuation = false, color, image = null, replyTo = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        // Store raw timestamp so recalcContinuations can detect time gaps
        if (timestamp) messageDiv.setAttribute('data-ts', new Date(timestamp).getTime());

        // ── Username area ────────────────────────────────────────────────
        const usernameArea = document.createElement('div');
        usernameArea.className = 'username-area';

        if (!isContinuation) {
            const senderEl = document.createElement('span');
            senderEl.className = 'message-sender';
            senderEl.setAttribute('data-sender', sender);
            senderEl.textContent = sender;
            if (color)              senderEl.style.color = color;
            else if (userColors[sender]) senderEl.style.color = userColors[sender];

            const sep = document.createElement('span');
            sep.className   = 'message-separator';
            sep.textContent = ' ~ ';

            usernameArea.appendChild(senderEl);
            usernameArea.appendChild(sep);
        }

        messageDiv.appendChild(usernameArea);

        // ── Message content ──────────────────────────────────────────────
        const messageContent = document.createElement('div');
        messageContent.className = 'message-content';

        // ── Reply quote block ────────────────────────────────────────────
        // The bracket shape (╭── author: text) is drawn entirely in CSS
        // using border-left + border-top + border-radius on .reply-quote.
        // --reply-color drives both the border and the ::after tail so
        // the bracket takes on the quoted sender's color.
        if (replyTo) {
            const quoteColor = replyTo.color || userColors[replyTo.username] || '#666';
            const quote = document.createElement('div');
            quote.className = 'reply-quote';
            // CSS var makes the bracket color match the quoted sender
            quote.style.setProperty('--reply-color', quoteColor);

            const qAuthor = document.createElement('span');
            qAuthor.className   = 'reply-quote-author';
            qAuthor.textContent = replyTo.username;
            qAuthor.style.color = quoteColor;

            const qSep  = document.createTextNode(': ');

            const qText = document.createElement('span');
            qText.className   = 'reply-quote-text';
            const raw = replyTo.message || '[image]';
            qText.textContent = raw.length > 100 ? raw.substring(0, 100) + '…' : raw;

            quote.appendChild(qAuthor);
            quote.appendChild(qSep);
            quote.appendChild(qText);
            messageContent.appendChild(quote);
        }

        // timestamps removed

        // Text
        if (message && message.length > 0) {
            messageContent.appendChild(document.createTextNode(message));
        }

        // Image
        if (image) {
            const img = document.createElement('img');
            img.src       = image;
            img.className = 'message-image';
            img.alt       = 'Shared image';
            img.onerror   = () => { img.alt = 'Image failed to load'; };
            img.addEventListener('click', () => window.open(image, '_blank'));
            if (message && message.length > 0) messageContent.appendChild(document.createElement('br'));
            messageContent.appendChild(img);
        }

        // Apply message color
        if (color)              messageContent.style.color = color;
        else if (userColors[sender]) messageContent.style.color = userColors[sender];

        messageDiv.appendChild(messageContent);

        // ── Reply button (↩) — appears on hover via CSS ──────────────────
        // We capture sender/message/color in a closure so the handler always
        // has the right data regardless of when it fires.
        const replyBtn = document.createElement('button');
        replyBtn.className   = 'reply-btn';
        replyBtn.textContent = '↩';
        replyBtn.title       = 'Reply';
        replyBtn.type        = 'button'; // prevent accidental form submission
        replyBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            setReply({
                username: sender,
                message: message || '',
                color: color || userColors[sender] || null
            });
        });
        messageDiv.appendChild(replyBtn);

        return messageDiv;
    }

    // ── Create a system message element ──────────────────────────────────
    function createSystemMessageElement(message, timestamp) {
        const div = document.createElement('div');
        div.className   = 'system-message';
        div.textContent = message;
        // timestamps removed
        return div;
    }

    // ── Display a new incoming message ────────────────────────────────────
    function displayMessage(sender, message, timestamp, color, image = null, replyTo = null) {
        // A reply always breaks a continuation run so the sender name is shown
        const isContinuation = !replyTo && (sender === lastMessageSender);
        const el = createMessageElement(sender, message, timestamp,
                                        isContinuation, color, image, replyTo);
        chatMessages.appendChild(el);
        lastMessageSender = sender;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (sender !== username && !isTabActive()) {
            playNotificationSound();
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('New Message from ' + sender, {
                    body: image ? 'Sent an image' + (message ? ': ' + message : '') : message,
                    icon: 'icon.png'
                });
            }
        }
    }

    // ── Display a system message ──────────────────────────────────────────
    function displaySystemMessage(message, timestamp) {
        chatMessages.appendChild(createSystemMessageElement(message, timestamp));
        lastMessageSender = null;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ── Update online user list ────────────────────────────────────────────
    function updateOnlineUsers(users) {
        onlineUsers.innerHTML = '';
        users.forEach(user => {
            const isObj    = typeof user === 'object';
            const uname    = isObj ? user.username : user;
            const isDnd    = isObj ? user.dnd : false;

            const item   = document.createElement('div');
            item.className = 'user-item';

            const dot = document.createElement('div');
            dot.className = 'user-status';
            dot.style.backgroundColor = isDnd ? '#ff6b6b' : '#4CAF50';

            const label = document.createElement('span');
            label.textContent = uname === window.username ? `${uname} (You)` : uname;
            if (userColors[uname]) label.style.color = userColors[uname];

            item.appendChild(dot);
            item.appendChild(label);
            onlineUsers.appendChild(item);
        });
    }

    // ── Update colors on existing messages ────────────────────────────────
    function updateDisplayedColors() {
        document.querySelectorAll('.message').forEach(el => {
            const sEl = el.querySelector('.message-sender');
            if (!sEl) return;
            const s = sEl.getAttribute('data-sender');
            if (userColors[s]) {
                sEl.style.color = userColors[s];
                const c = el.querySelector('.message-content');
                if (c) c.style.color = userColors[s];
            }
        });
    }

    function isTabActive() { return !document.hidden; }

    // ── Notification sound ────────────────────────────────────────────────
    const mp3Source = document.createElement('source');
    mp3Source.src  = 'public/sounds/notif.mp3';
    mp3Source.type = 'audio/mpeg';
    const wavSource = document.createElement('source');
    wavSource.src  = 'public/sounds/notif.wav';
    wavSource.type = 'audio/wav';
    notificationSound.appendChild(mp3Source);
    notificationSound.appendChild(wavSource);

    function playNotificationSound() {
        if (isDndEnabled) return;
        notificationSound.currentTime = 0;
        notificationSound.volume      = 0.5;
        const p = notificationSound.play();
        if (p) p.catch(() => {});
    }

    // ── Animal typing sounds ───────────────────────────────────────────────
    let enableSounds = localStorage.getItem('enable_sounds') === 'true';
    const animalSounds = {};
    'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
        const s = new Audio(`public/sounds/animal/${letter}.wav`);
        s.volume = 0.2;
        animalSounds[letter] = s;
    });

    chatInput.addEventListener('keydown', (e) => {
        if (!enableSounds) return;
        const key = e.key.toLowerCase();
        if (animalSounds[key]) {
            animalSounds[key].currentTime = 0;
            animalSounds[key].play().catch(() => {});
        }
    });

    // ── Live emoji replacement while typing ───────────────────────────────
    chatInput.addEventListener('input', () => {
        const pos = chatInput.selectionStart;
        const before = chatInput.value.slice(0, pos);
        const after  = chatInput.value.slice(pos);
        const newBefore = replaceEmojis(before);
        chatInput.value = newBefore + after;
        chatInput.selectionStart = chatInput.selectionEnd = newBefore.length;
    });

    // ── Notification permission ───────────────────────────────────────────
    if ('Notification' in window) {
        Notification.requestPermission().then(p => {
            if (p === 'granted') console.log('Notification permission granted.');
        });
    }

    // ── showImagePreview (used by clipboard paste) ─────────────────────────
    function showImagePreview(file) {
        // Remove any existing preview
        const old = document.getElementById('paste-preview');
        if (old) old.remove();

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.createElement('img');
            img.id        = 'paste-preview';
            img.src       = e.target.result;
            img.className = 'image-preview';
            img.style.maxWidth  = '120px';
            img.style.maxHeight = '80px';
            img.style.margin    = '4px 8px 0';
            // Insert the preview just before the chat form
            chatForm.parentNode.insertBefore(img, chatForm);
        };
        reader.readAsDataURL(file);
    }

    document.addEventListener('visibilitychange', () => {});
    </script>
</body>
</html>
