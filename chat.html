<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hatchat - Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/public/icons/icon-192.png">
</head>
<body>
    <header>
        <div class="logo">hatchat - 1.0.0.7</div>
        <nav><ul>
            <li><a href="clips.html">clips</a></li>
            <li><a href="index.html">homepage</a></li>
            <li><a href="chat.html">hatchat</a></li>
            <li><a href="settings.html">settings</a></li>
            <li><a href="download.html">download</a></li>
        </ul></nav>
    </header>

    <div class="load-more-container">
        <button id="load-more-btn" class="load-more-btn">Load Earlier Messages</button>
    </div>

    <div class="main-content">
        <div class="user-list">
            <div class="dnd-toggle-container">
                <label><input type="checkbox" id="dnd-toggle"> Do Not Disturb</label>
            </div>
            <h3>fellow hattingtons</h3>
            <div class="online-users" id="online-users"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h2>Live Chat</h2>
                <p id="connection-status">Connecting...</p>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="loading-indicator" id="loading-indicator"></div>
            </div>
            <div class="reply-preview" id="reply-preview">
                <span class="reply-preview-label">replying to</span>
                <span class="reply-preview-text" id="reply-preview-text"></span>
                <button class="reply-cancel-btn" id="reply-cancel-btn" title="Cancel reply">✕</button>
            </div>
            <form class="chat-form" id="chat-form">
                <input type="text" class="chat-input" id="chat-input"
                       placeholder="Type your message..." autocomplete="off">
                <label for="image-upload" class="upload-btn">
                    <span class="upload-icon">📷</span>
                </label>
                <input type="file" id="image-upload" accept="image/*" style="display:none">
                <button type="submit" class="chat-button">Send</button>
            </form>
        </div>

        <!-- Voice Chat Panel -->
        <div class="voice-panel" id="voice-panel">
            <h3 class="voice-panel-title">voice</h3>
            <div class="voice-channel">
                <div class="voice-channel-header">
                    <span class="voice-channel-icon">🔊</span>
                    <span class="voice-channel-name">general</span>
                    <button class="voice-join-btn" id="voice-join-btn">join</button>
                </div>
                <div class="voice-members" id="voice-members"></div>
            </div>
            <div class="voice-controls" id="voice-controls" style="display:none">
                <button class="voice-ctrl-btn" id="voice-mute-btn">🎤 mute</button>
                <button class="voice-ctrl-btn" id="voice-deaf-btn">🔇 deafen</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content" style="max-width:360px;width:90%">

            <!-- LOGIN -->
            <div id="auth-login">
                <h2>hatchat</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input class="form-input" id="login-username" placeholder="your username" maxlength="8">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input class="form-input" id="login-password" type="password" placeholder="password">
                </div>
                <p id="login-error" style="color:#cf6f6f;font-size:.8rem;min-height:1.2em;margin:.25rem 0"></p>
                <button class="form-button" id="login-btn">log in</button>
                <p style="margin-top:.75rem;font-size:.8rem;color:#666;text-align:center">
                    no account? <a href="#" id="go-register" style="color:#7c6af7">register</a>
                </p>
            </div>

            <!-- REGISTER -->
            <div id="auth-register" style="display:none">
                <h2>create account</h2>
                <div class="form-group">
                    <label>Username <small style="color:#555">(max 8 chars)</small></label>
                    <input class="form-input" id="reg-username" placeholder="username" maxlength="8">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input class="form-input" id="reg-password" type="password" placeholder="password">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:.75rem">
                    <label style="margin:0">Message Color</label>
                    <input type="color" id="reg-color" value="#FFFFFF" style="width:2.5rem;height:2rem;border:none;background:none;cursor:pointer">
                </div>
                <p id="reg-error" style="color:#cf6f6f;font-size:.8rem;min-height:1.2em;margin:.25rem 0"></p>
                <button class="form-button" id="reg-btn">create account</button>
                <p style="margin-top:.75rem;font-size:.8rem;color:#666;text-align:center">
                    have an account? <a href="#" id="go-login" style="color:#7c6af7">log in</a>
                </p>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script>
    // ── Constants ────────────────────────────────────────────────────────
    // API always lives on Render — GitHub Pages only serves static HTML.
    const SERVER = 'https://averrgy-github-io.onrender.com';

    // ── State ────────────────────────────────────────────────────────────
    let username = '', userColor = '#FFFFFF', socket;
    let currentPage = 1, isLoading = false;
    let selectedImage = null, isUploading = false, isDndEnabled = false;
    let userColors = {}, replyingTo = null;

    // ── DOM refs ─────────────────────────────────────────────────────────
    const chatMessagesEl   = document.getElementById('chat-messages');
    const chatForm         = document.getElementById('chat-form');
    const chatInput        = document.getElementById('chat-input');
    const onlineUsersEl    = document.getElementById('online-users');
    const connectionStatus = document.getElementById('connection-status');
    const loadMoreBtn      = document.getElementById('load-more-btn');
    const loadingIndicator = document.getElementById('loading-indicator');
    const dndToggle        = document.getElementById('dnd-toggle');
    const replyPreview     = document.getElementById('reply-preview');
    const replyPreviewText = document.getElementById('reply-preview-text');
    const replyCancelBtn   = document.getElementById('reply-cancel-btn');
    const authModal        = document.getElementById('auth-modal');
    const notificationSound = new Audio('/public/sounds/notif.mp3');

    // ── Emoji shortcuts ──────────────────────────────────────────────────
    const emojiMap = {
        ':smile:':'🙂',':heart:':'❤️',':tongue:':'👅',':green_square:':'🟩',
        ':anatomical_heart:':'🫀 (ANATOMICAL HEART!!!)',':locomotive:':'🚂',
        ':train:':'🚂',':horse:':'🐎',':fish:':'🐟',':nerd:':'🤓'
    };
    function replaceEmojis(t) { return t.replace(/:\w+:/g, m => emojiMap[m] || m); }

    // ── Reply helpers ────────────────────────────────────────────────────
    function setReply(data) {
        replyingTo = data;
        const preview = data.message
            ? `${data.username}: ${data.message.substring(0,80)}${data.message.length>80?'…':''}`
            : `${data.username}: [image]`;
        replyPreviewText.textContent = preview;
        replyPreview.style.display = 'flex';
        chatInput.focus();
    }
    function clearReply() {
        replyingTo = null;
        replyPreview.style.display = 'none';
        replyPreviewText.textContent = '';
    }
    replyCancelBtn.addEventListener('click', clearReply);

    // ── Auth flow ────────────────────────────────────────────────────────
    const vLogin    = document.getElementById('auth-login');
    const vRegister = document.getElementById('auth-register');
    function showView(v) {
        [vLogin, vRegister].forEach(el => el.style.display = 'none');
        v.style.display = '';
    }
    document.getElementById('go-register').addEventListener('click', e => { e.preventDefault(); showView(vRegister); });
    document.getElementById('go-login').addEventListener('click',    e => { e.preventDefault(); showView(vLogin); });

    // Login
    document.getElementById('login-btn').addEventListener('click', async () => {
        const u = document.getElementById('login-username').value.trim();
        const p = document.getElementById('login-password').value;
        const err = document.getElementById('login-error');
        err.textContent = '';
        if (!u || !p) { err.textContent = 'fill in all fields'; return; }
        try {
            const r = await fetch(`${SERVER}/api/login`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const d = await r.json();
            if (!d.success) { err.textContent = d.message; return; }
            localStorage.setItem('hc_token', d.token);
            localStorage.setItem('chat_username', d.username);
            localStorage.setItem('chat_color', d.color);
            authModal.style.display = 'none';
            username = d.username; userColor = d.color;
            initializeChat(d.color);
        } catch(e) { err.textContent = 'server error — try again'; }
    });

    // Register — creates account and logs in immediately, no email needed
    document.getElementById('reg-btn').addEventListener('click', async () => {
        const u = document.getElementById('reg-username').value.trim();
        const p = document.getElementById('reg-password').value;
        const c = document.getElementById('reg-color').value;
        const err = document.getElementById('reg-error');
        err.textContent = '';
        if (!u || !p) { err.textContent = 'fill in all fields'; return; }
        try {
            const r = await fetch(`${SERVER}/api/register`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ username: u, password: p, color: c })
            });
            const d = await r.json();
            if (!d.success) { err.textContent = d.message; return; }
            // Registration returns a token — log straight in
            localStorage.setItem('hc_token', d.token);
            localStorage.setItem('chat_username', d.username);
            localStorage.setItem('chat_color', d.color);
            authModal.style.display = 'none';
            username = d.username; userColor = d.color;
            initializeChat(d.color);
        } catch(e) { err.textContent = 'server error — try again'; }
    });

    // Enter key support for login/register
    ['login-password','login-username'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
    });

    // ── Boot: try stored token, else show modal ──────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
        const token    = localStorage.getItem('hc_token');
        const storedUser  = localStorage.getItem('chat_username');
        const storedColor = localStorage.getItem('chat_color') || '#FFFFFF';

        if (token) {
            try {
                const r = await fetch(`${SERVER}/api/me?token=${token}`);
                const d = await r.json();
                if (d.success) {
                    // Valid session — skip the modal entirely
                    username  = d.username;
                    userColor = d.color;
                    localStorage.setItem('chat_username', d.username);
                    localStorage.setItem('chat_color', d.color);
                    authModal.style.display = 'none';
                    initializeChat(d.color);
                    return;
                }
            } catch(e) {}
        }

        // Fallback: if we have a stored username (old-style pre-accounts), auto-fill the login
        if (storedUser) document.getElementById('login-username').value = storedUser;
        authModal.style.display = 'flex';
    });


    // ── initializeChat ───────────────────────────────────────────────────
    function initializeChat(color) {
        socket = io(SERVER, {
            query: { username, color },
            reconnection: true, reconnectionAttempts: 5,
            reconnectionDelay: 1000, reconnectionDelayMax: 5000
        });

        socket.on('connect', () => {
            connectionStatus.textContent = 'Connected';
            connectionStatus.style.color = '#4CAF50';
            socket.emit('user_join', { username });
            loadMessages(1);
            loadAllUsers(); // populate the full user panel
        });
        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.style.color = '#ff6b6b';
        });

        socket.on('chat_message', (data) => {
            displayMessage(data.username, data.message, data.timestamp, data.color, data.image, data.replyTo);
        });
        socket.on('scroll_to_latest', () => { chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight; });

        socket.on('chat_history', (data) => {
            loadingIndicator.style.display = 'none';
            isLoading = false;
            if (data.userColors) userColors = data.userColors;
            if (currentPage === 1) { chatMessagesEl.innerHTML = ''; }

            const messagesArray = [];
            data.messages.forEach((msg, index) => {
                if (msg.type === 'system') {
                    messagesArray.push(createSystemMessageElement(msg.message));
                } else {
                    let isCont = false;
                    if (currentPage > 1 && index > 0 && !msg.replyTo) {
                        const prev = data.messages[index - 1];
                        isCont = prev.type !== 'system' && prev.username === msg.username;
                    }
                    messagesArray.push(createMessageElement(
                        msg.username, msg.message, msg.timestamp,
                        isCont, msg.color || userColors[msg.username], msg.image, msg.replyTo
                    ));
                }
            });

            if (currentPage === 1) {
                messagesArray.reverse();
                recalcContinuations(messagesArray);
            } else {
                recalcContinuations(messagesArray);
            }

            const frag = document.createDocumentFragment();
            messagesArray.forEach(el => frag.appendChild(el));
            if (currentPage === 1) {
                chatMessagesEl.appendChild(frag);
                chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            } else {
                chatMessagesEl.insertBefore(frag, chatMessagesEl.firstChild);
            }
            loadMoreBtn.disabled = (data.messages.length < 20);
        });

        socket.on('user_join',  (data) => {
            displaySystemMessage(`${data.username} has joined the chat`);
            if (data.userColors) userColors = data.userColors;
            loadAllUsers();
        });
        socket.on('user_leave', (data) => {
            displaySystemMessage(`${data.username} has left the chat`);
            if (data.userColors) userColors = data.userColors;
            loadAllUsers();
        });
        socket.on('update_users',    () => loadAllUsers());
        socket.on('refresh_all_users', () => loadAllUsers());
        socket.on('update_colors', (data) => {
            if (data.userColors) { userColors = data.userColors; updateDisplayedColors(); }
        });

        loadMoreBtn.addEventListener('click', () => {
            if (!isLoading) { currentPage++; loadMessages(currentPage); }
        });
        document.getElementById('color-input') && document.getElementById('color-input').addEventListener('change', (e) => {
            socket.emit('update_color', { color: e.target.value });
        });
        dndToggle.addEventListener('change', () => {
            isDndEnabled = dndToggle.checked;
            socket.emit('dnd_toggle', isDndEnabled);
        });

        setupImageUpload();
        initVoice();

        chatInput.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    if (file.size > 5 * 1024 * 1024) { alert('Pasted image is too large. Max 5MB.'); return; }
                    selectedImage = file;
                    chatInput.placeholder = 'Image pasted. Type a caption and send.';
                    showImagePreview(file);
                    e.preventDefault();
                    return;
                }
            }
        });

        chatInput.addEventListener('input', () => {
            const pos = chatInput.selectionStart;
            const before = chatInput.value.slice(0, pos);
            const after  = chatInput.value.slice(pos);
            const nb = replaceEmojis(before);
            chatInput.value = nb + after;
            chatInput.selectionStart = chatInput.selectionEnd = nb.length;
        });
    }


    // ── All-users panel (online + offline registered accounts) ───────────
    async function loadAllUsers() {
        try {
            const r = await fetch(`${SERVER}/api/all-users`);
            const d = await r.json();
            if (!d.success) return;
            renderAllUsers(d.users);
        } catch(e) {}
    }

    function renderAllUsers(allUsers) {
        onlineUsersEl.innerHTML = '';
        const online  = allUsers.filter(u => u.online);
        const offline = allUsers.filter(u => !u.online);

        online.forEach(u => {
            const item = document.createElement('div');
            item.className = 'user-item';
            const dot = document.createElement('span');
            dot.className = 'user-dot'; // green via CSS
            const label = document.createElement('span');
            label.textContent = u.username;
            label.style.color = u.color || userColors[u.username] || '#e0e0e0';
            item.appendChild(dot); item.appendChild(label);
            onlineUsersEl.appendChild(item);
        });

        if (offline.length > 0) {
            const divider = document.createElement('div');
            divider.className = 'offline-divider';
            divider.textContent = '── offline ──';
            onlineUsersEl.appendChild(divider);

            offline.forEach(u => {
                const item = document.createElement('div');
                item.className = 'user-item user-offline';
                const dot = document.createElement('span');
                dot.className = 'user-dot user-dot-offline'; // grey
                const label = document.createElement('span');
                label.textContent = u.username;
                label.style.color = '#555';
                item.appendChild(dot); item.appendChild(label);
                onlineUsersEl.appendChild(item);
            });
        }
    }

    // ── Message helpers ──────────────────────────────────────────────────
    function recalcContinuations(elements) {
        const GAP_MS = 5 * 60 * 1000;
        let prevSender = null, prevTs = null;
        elements.forEach(el => {
            if (el.classList.contains('system-message')) { prevSender = null; prevTs = null; return; }
            const sEl = el.querySelector('.message-sender');
            if (!sEl) return;
            const sender   = sEl.getAttribute('data-sender');
            const hasReply = !!el.querySelector('.reply-thread');
            const tsRaw    = el.getAttribute('data-ts');
            const ts       = tsRaw ? parseInt(tsRaw, 10) : null;
            const sameUser = prevSender === sender;
            const smallGap = (ts && prevTs) ? (ts - prevTs) < GAP_MS : true;
            const isCont   = sameUser && smallGap && !hasReply;
            el.classList.toggle('continued-message', isCont);
            prevSender = sender; prevTs = ts || prevTs;
        });
    }

    function loadMessages(page) {
        if (isLoading) return;
        isLoading = true;
        loadingIndicator.textContent = 'Loading messages...';
        loadingIndicator.style.display = 'flex';
        socket.emit('load_messages', { page });
    }

    function createMessageElement(sender, message, timestamp, isContinuation=false, color, image=null, replyTo=null) {
        const div = document.createElement('div');
        div.className = 'message';
        if (isContinuation) div.classList.add('continued-message');
        if (replyTo) div.classList.add('is-reply');
        if (timestamp) div.setAttribute('data-ts', new Date(timestamp).getTime());

        const msgColor = color || userColors[sender] || null;

        const usernameArea = document.createElement('div');
        usernameArea.className = 'username-area';
        const senderEl = document.createElement('span');
        senderEl.className = 'message-sender';
        senderEl.setAttribute('data-sender', sender);
        senderEl.textContent = sender;
        if (msgColor) senderEl.style.color = msgColor;
        senderEl.style.cursor = 'pointer';
        senderEl.addEventListener('click', e => { e.stopPropagation(); setReply({ username: sender, message: message || '', color: msgColor }); });
        const sep = document.createElement('span');
        sep.className = 'message-separator'; sep.textContent = ' ~ ';
        usernameArea.appendChild(senderEl); usernameArea.appendChild(sep);

        const content = document.createElement('div');
        content.className = 'message-content';
        if (msgColor) content.style.color = msgColor;
        content.style.cursor = 'pointer';
        content.title = 'Click to reply';
        content.addEventListener('click', () => setReply({ username: sender, message: message || '', color: msgColor }));

        if (replyTo) {
            const replyLineColor = replyTo.color || userColors[replyTo.username] || '#555';
            const thread = document.createElement('div');
            thread.className = 'reply-thread';
            thread.style.setProperty('--thread-color', replyLineColor);
            const refLine = document.createElement('div');
            refLine.className = 'reply-ref';
            const refAuthor = document.createElement('span');
            refAuthor.className = 'reply-ref-author'; refAuthor.textContent = replyTo.username; refAuthor.style.color = replyLineColor;
            const refText = document.createElement('span');
            refText.className = 'reply-ref-text';
            const raw = replyTo.message || '[image]';
            refText.textContent = ': ' + (raw.length > 55 ? raw.substring(0,55)+'…' : raw);
            refLine.appendChild(refAuthor); refLine.appendChild(refText);
            const replyBody = document.createElement('div');
            replyBody.className = 'reply-body';
            if (msgColor) replyBody.style.color = msgColor;
            if (message) replyBody.appendChild(document.createTextNode(message));
            if (image) { const img = makeImg(image); if (message) replyBody.appendChild(document.createElement('br')); replyBody.appendChild(img); }
            thread.appendChild(refLine); thread.appendChild(replyBody);
            content.appendChild(thread);
        } else {
            if (message) content.appendChild(document.createTextNode(message));
            if (image) { const img = makeImg(image); if (message) content.appendChild(document.createElement('br')); content.appendChild(img); }
        }

        div.appendChild(usernameArea); div.appendChild(content);
        return div;
    }

    function makeImg(src) {
        const img = document.createElement('img');
        img.src = src; img.className = 'message-image'; img.alt = 'Shared image';
        img.onerror = () => { img.alt = 'Image failed to load'; };
        img.addEventListener('click', e => { e.stopPropagation(); window.open(src, '_blank'); });
        return img;
    }

    function createSystemMessageElement(message) {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.textContent = message;
        return div;
    }

    function displayMessage(sender, message, timestamp, color, image=null, replyTo=null) {
        const allMsgs = chatMessagesEl.querySelectorAll('.message:not(.system-message)');
        let lastDOMSender = null;
        if (allMsgs.length > 0) {
            const sEl = allMsgs[allMsgs.length-1].querySelector('.message-sender');
            if (sEl) lastDOMSender = sEl.getAttribute('data-sender');
        }
        const lastChild = chatMessagesEl.lastElementChild;
        const lastIsSystem = lastChild && lastChild.classList.contains('system-message');
        const isCont = !replyTo && !lastIsSystem && lastDOMSender === sender;
        const el = createMessageElement(sender, message, timestamp, isCont, color, image, replyTo);
        chatMessagesEl.appendChild(el);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function displaySystemMessage(message) {
        const el = createSystemMessageElement(message);
        chatMessagesEl.appendChild(el);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function updateDisplayedColors() {
        document.querySelectorAll('.message').forEach(el => {
            const sEl = el.querySelector('.message-sender');
            if (!sEl) return;
            const s = sEl.getAttribute('data-sender');
            if (userColors[s]) {
                sEl.style.color = userColors[s];
                const c = el.querySelector('.message-content');
                if (c) c.style.color = userColors[s];
            }
        });
    }


    // ── Image upload ─────────────────────────────────────────────────────
    function showImagePreview(file) {
        const old = document.getElementById('paste-preview');
        if (old) old.remove();
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.createElement('img');
            img.id = 'paste-preview'; img.src = e.target.result;
            img.style.cssText = 'max-width:120px;max-height:80px;margin:4px 8px 0;display:block;';
            chatForm.parentNode.insertBefore(img, chatForm);
        };
        reader.readAsDataURL(file);
    }

    function setupImageUpload() {
        const imageUpload = document.getElementById('image-upload');
        imageUpload.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('Please select an image file.'); imageUpload.value=''; return; }
            if (file.size > 5*1024*1024) { alert('Image must be under 5 MB.'); imageUpload.value=''; return; }
            selectedImage = file;
            chatInput.placeholder = `Image "${file.name}" selected. Type a caption and send.`;
        });

        chatForm.addEventListener('submit', async e => {
            e.preventDefault();
            let message = replaceEmojis(chatInput.value.trim());
            if (!message && !selectedImage) return;
            if (!socket || isUploading) return;
            const currentReply = replyingTo ? { ...replyingTo } : null;

            const pastePreview = document.getElementById('paste-preview');
            if (pastePreview) pastePreview.remove();

            if (selectedImage) {
                isUploading = true;
                const loader = document.createElement('div');
                loader.className = 'image-loader';
                chatForm.appendChild(loader);
                const formData = new FormData();
                formData.append('image', selectedImage);
                try {
                    const response = await fetch(`${SERVER}/upload`, { method: 'POST', body: formData });
                    if (!response.ok) throw new Error(`Server ${response.status}`);
                    const result = await response.json();
                    if (result.success) {
                        let imgPath = result.filePath;
                        if (imgPath && !imgPath.startsWith('http')) imgPath = SERVER + (imgPath.startsWith('/') ? '' : '/') + imgPath;
                        socket.emit('chat_message', { message, image: imgPath, replyTo: currentReply });
                    } else { alert('Upload failed: ' + (result.message || 'unknown')); }
                } catch(err) { alert('Upload error: ' + err.message); }
                finally {
                    isUploading = false; selectedImage = null;
                    chatInput.placeholder = 'Type your message...';
                    chatForm.removeChild(loader);
                }
            } else {
                socket.emit('chat_message', { message, replyTo: currentReply });
            }

            chatInput.value = '';
            imageUpload.value = '';
            chatInput.focus();
            clearReply();
        });
    }

    // ── Voice Chat ───────────────────────────────────────────────────────
    function initVoice() {
        const joinBtn    = document.getElementById('voice-join-btn');
        const membersEl  = document.getElementById('voice-members');
        const controlsEl = document.getElementById('voice-controls');
        const muteBtn    = document.getElementById('voice-mute-btn');
        const deafBtn    = document.getElementById('voice-deaf-btn');

        let inVoice = false, isMuted = false, isDeafened = false;
        let localStream = null;
        const peers    = {};
        const audioEls = {};
        let voiceMembers = {};

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function renderMembers() {
            membersEl.innerHTML = '';
            if (inVoice) {
                const self = document.createElement('div');
                self.className = 'voice-member self';
                self.innerHTML = `<span class="voice-member-icon">${isMuted ? '🔇' : '🎙'}</span><span>${username} <span style="color:#555;font-size:.65em">(you)</span></span>`;
                membersEl.appendChild(self);
            }
            Object.values(voiceMembers).forEach(({ username: u, muted }) => {
                const div = document.createElement('div');
                div.className = 'voice-member';
                div.innerHTML = `<span class="voice-member-icon">${muted ? '🔇' : '🎙'}</span><span>${u}</span>`;
                membersEl.appendChild(div);
            });
        }

        async function joinVoice() {
            try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
            catch(e) { alert('Microphone access denied: ' + e.message); return; }
            inVoice = true;
            joinBtn.textContent = 'leave'; joinBtn.classList.add('active');
            controlsEl.style.display = 'flex';
            renderMembers();
            socket.emit('voice_join', { username });
        }

        function leaveVoice() {
            socket.emit('voice_leave', { username });
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            Object.values(peers).forEach(pc => pc.close());
            Object.keys(peers).forEach(id => delete peers[id]);
            Object.values(audioEls).forEach(a => { a.srcObject = null; a.remove(); });
            Object.keys(audioEls).forEach(id => delete audioEls[id]);
            voiceMembers = {};
            inVoice = false; isMuted = false; isDeafened = false;
            joinBtn.textContent = 'join'; joinBtn.classList.remove('active');
            controlsEl.style.display = 'none';
            muteBtn.classList.remove('active'); deafBtn.classList.remove('active');
            muteBtn.textContent = '🎤 mute'; deafBtn.textContent = '🔇 deafen';
            renderMembers();
        }

        joinBtn.addEventListener('click', () => inVoice ? leaveVoice() : joinVoice());

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            muteBtn.classList.toggle('active', isMuted);
            muteBtn.textContent = isMuted ? '🎤 unmute' : '🎤 mute';
            socket.emit('voice_mute', { muted: isMuted });
            renderMembers();
        });

        deafBtn.addEventListener('click', () => {
            isDeafened = !isDeafened;
            Object.values(audioEls).forEach(a => a.muted = isDeafened);
            deafBtn.classList.toggle('active', isDeafened);
            deafBtn.textContent = isDeafened ? '🔇 undeafen' : '🔇 deafen';
        });

        async function createPeer(remoteId, initiator) {
            if (peers[remoteId]) return peers[remoteId];
            const pc = new RTCPeerConnection(iceConfig);
            peers[remoteId] = pc;
            if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.onicecandidate = e => { if (e.candidate) socket.emit('voice_ice', { to: remoteId, candidate: e.candidate }); };
            pc.ontrack = e => {
                let audio = audioEls[remoteId];
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.autoplay = true; audio.muted = isDeafened; audio.style.display = 'none';
                    document.body.appendChild(audio); audioEls[remoteId] = audio;
                }
                if (e.streams && e.streams[0]) { audio.srcObject = e.streams[0]; audio.play().catch(()=>{}); }
            };
            pc.onnegotiationneeded = async () => {
                if (initiator) {
                    try {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        socket.emit('voice_offer', { to: remoteId, offer: pc.localDescription });
                    } catch(e) { console.error('Offer error:', e); }
                }
            };
            return pc;
        }

        socket.on('voice_user_joined', async ({ socketId, username: u }) => {
            voiceMembers[socketId] = { username: u, muted: false }; renderMembers();
            if (inVoice) await createPeer(socketId, true);
        });
        socket.on('voice_current_members', async (members) => {
            members.forEach(({ socketId, username: u }) => { voiceMembers[socketId] = { username: u, muted: false }; });
            renderMembers();
            for (const { socketId } of members) await createPeer(socketId, false);
        });
        socket.on('voice_offer', async ({ from, offer }) => {
            let pc = peers[from]; if (!pc) pc = await createPeer(from, false);
            try {
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('voice_answer', { to: from, answer: pc.localDescription });
            } catch(e) { console.error('voice_offer error:', e); }
        });
        socket.on('voice_answer', async ({ from, answer }) => {
            const pc = peers[from];
            if (pc && pc.signalingState !== 'stable') {
                try { await pc.setRemoteDescription(new RTCSessionDescription(answer)); } catch(e) {}
            }
        });
        socket.on('voice_ice', async ({ from, candidate }) => {
            const pc = peers[from];
            if (pc && pc.remoteDescription) { try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {} }
        });
        socket.on('voice_user_left', ({ socketId }) => {
            if (peers[socketId]) { peers[socketId].close(); delete peers[socketId]; }
            if (audioEls[socketId]) { audioEls[socketId].srcObject = null; audioEls[socketId].remove(); delete audioEls[socketId]; }
            delete voiceMembers[socketId]; renderMembers();
        });
        socket.on('voice_mute_update', ({ socketId, muted }) => {
            if (voiceMembers[socketId]) { voiceMembers[socketId].muted = muted; renderMembers(); }
        });
    }

    // ── PWA service worker ───────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
    </script>
