<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hatchat - Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/public/icons/icon-192.png">
</head>
<body>
    <header>
        <div class="logo">hatchat - 1.0.0.7</div>
        <nav><ul>
            <li><a href="clips.html">clips</a></li>
            <li><a href="index.html">homepage</a></li>
            <li><a href="chat.html">hatchat</a></li>
            <li><a href="settings.html">settings</a></li>
            <li><a href="download.html">download</a></li>
        </ul></nav>
    </header>

    <div class="load-more-container">
        <button id="load-more-btn" class="load-more-btn">Load Earlier Messages</button>
    </div>

    <div class="main-content">
        <div class="user-list">
            <div class="dnd-toggle-container">
                <label><input type="checkbox" id="dnd-toggle"> Do Not Disturb</label>
            </div>
            <h3>fellow hattingtons</h3>
            <div class="online-users" id="online-users"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h2>Live Chat</h2>
                <p id="connection-status">Connecting...</p>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="loading-indicator" id="loading-indicator"></div>
            </div>
            <div class="reply-preview" id="reply-preview">
                <span class="reply-preview-label">replying to</span>
                <span class="reply-preview-text" id="reply-preview-text"></span>
                <button class="reply-cancel-btn" id="reply-cancel-btn" title="Cancel reply">✕</button>
            </div>
            <form class="chat-form" id="chat-form">
                <input type="text" class="chat-input" id="chat-input"
                       placeholder="Type your message..." autocomplete="off">
                <label for="image-upload" class="upload-btn">
                    <span class="upload-icon">📷</span>
                </label>
                <input type="file" id="image-upload" accept="image/*" style="display:none">
                <button type="submit" class="chat-button">Send</button>
            </form>
        </div>

        <!-- Voice Chat Panel -->
        <div class="voice-panel" id="voice-panel">
            <h3 class="voice-panel-title">voice</h3>
            <div class="voice-channel">
                <div class="voice-channel-header">
                    <span class="voice-channel-icon">🔊</span>
                    <span class="voice-channel-name">general</span>
                    <button class="voice-join-btn" id="voice-join-btn">join</button>
                </div>
                <div class="voice-members" id="voice-members"></div>
            </div>
            <div class="voice-controls" id="voice-controls" style="display:none">
                <button class="voice-ctrl-btn" id="voice-mute-btn">🎤 mute</button>
                <button class="voice-ctrl-btn" id="voice-deaf-btn">🔇 deafen</button>
            </div>
        </div>
    </div>

    <!-- Username Modal -->
    <div class="modal" id="username-modal">
        <div class="modal-content">
            <h2>Enter Your Username</h2>
            <form id="username-form">
                <div class="form-group">
                    <label for="username-input">Username:</label>
                    <input type="text" class="form-input" id="username-input" placeholder="Your username" required>
                </div>
                <div class="form-group">
                    <label for="color-input">Message Color:</label>
                    <input type="color" class="form-input" id="color-input" value="#FFFFFF">
                </div>
                <button type="submit" class="form-button">Join Chat</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script>
    if (location.protocol === 'http:' && location.hostname !== 'localhost') {
        location.replace('https:' + location.href.substring(5));
    }

    const SERVER_URL = 'https://averrgy-github-io.onrender.com';

    let username = '', socket;
    let currentPage = 1, isLoading = false, lastMessageSender = null;
    let selectedImage = null, isUploading = false, isDndEnabled = false;
    let userColors = {}, replyingTo = null;

    const chatMessages     = document.getElementById('chat-messages');
    const chatForm         = document.getElementById('chat-form');
    const chatInput        = document.getElementById('chat-input');
    const onlineUsers      = document.getElementById('online-users');
    const usernameModal    = document.getElementById('username-modal');
    const usernameForm     = document.getElementById('username-form');
    const usernameInput    = document.getElementById('username-input');
    const connectionStatus = document.getElementById('connection-status');
    const loadMoreBtn      = document.getElementById('load-more-btn');
    const loadingIndicator = document.getElementById('loading-indicator');
    const colorInput       = document.getElementById('color-input');
    const dndToggle        = document.getElementById('dnd-toggle');
    const replyPreview     = document.getElementById('reply-preview');
    const replyPreviewText = document.getElementById('reply-preview-text');
    const replyCancelBtn   = document.getElementById('reply-cancel-btn');
    const notificationSound = new Audio();

    const emojiMap = {
        ':smile:':'🙂',':heart:':'❤️',':tongue:':'👅',':green_square:':'🟩',
        ':anatomical_heart:':'🫀 (ANATOMICAL HEART!!!)',':locomotive:':'🚂',
        ':train:':'🚂',':horse:':'🐎',':fish:':'🐟',':nerd:':'🤓'
    };
    function replaceEmojis(text) { return text.replace(/:\w+:/g, m => emojiMap[m] || m); }

    function setReply(data) {
        replyingTo = data;
        const preview = data.message
            ? `${data.username}: ${data.message.substring(0,80)}${data.message.length>80?'…':''}`
            : `${data.username}: [image]`;
        replyPreviewText.textContent = preview;
        replyPreview.style.display = 'flex';
        chatInput.focus();
    }
    function clearReply() {
        replyingTo = null;
        replyPreview.style.display = 'none';
        replyPreviewText.textContent = '';
    }
    replyCancelBtn.addEventListener('click', clearReply);

    window.addEventListener('DOMContentLoaded', () => {
        const storedUsername = localStorage.getItem('chat_username');
        const storedColor    = localStorage.getItem('chat_color') || '#FFFFFF';
        if (storedUsername) {
            username = storedUsername;
            if (colorInput) colorInput.value = storedColor;
            initializeChat(storedColor);
        } else {
            usernameModal.style.display = 'flex';
        }
    });

    usernameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const entered = usernameInput.value.trim();
        if (entered.length > 8) { alert('Username must be 8 characters or less.'); return; }
        if (!entered) return;
        username = entered;
        const selectedColor = document.getElementById('color-input').value;
        localStorage.setItem('chat_username', username);
        localStorage.setItem('chat_color', selectedColor);
        usernameModal.style.display = 'none';
        initializeChat(selectedColor);
    });

    function initializeChat(selectedColor) {
        socket = io(SERVER_URL, {
            query: { username, color: selectedColor },
            reconnection: true, reconnectionAttempts: 5,
            reconnectionDelay: 1000, reconnectionDelayMax: 5000
        });

        socket.on('chat_message', (data) => {
            displayMessage(data.username, data.message, data.timestamp,
                           data.color, data.image, data.replyTo);
            if (data.image) socket.emit('image_posted');
        });

        socket.on('scroll_to_latest', () => { chatMessages.scrollTop = chatMessages.scrollHeight; });

        socket.on('connect', () => {
            connectionStatus.textContent = 'Connected';
            connectionStatus.style.color = '#4CAF50';
            socket.emit('user_join', { username });
            loadMessages(1);
        });

        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.style.color = '#ff6b6b';
        });

        socket.on('chat_history', (data) => {
            loadingIndicator.style.display = 'none';
            isLoading = false;
            if (data.userColors) userColors = data.userColors;
            if (currentPage === 1) { chatMessages.innerHTML = ''; lastMessageSender = null; }

            const messagesArray = [];
            data.messages.forEach((msg, index) => {
                if (msg.type === 'system') {
                    messagesArray.push(createSystemMessageElement(msg.message, msg.timestamp));
                    lastMessageSender = null;
                } else {
                    let isContinuation = false;
                    if (currentPage > 1 && index > 0 && !msg.replyTo) {
                        const prev = data.messages[index - 1];
                        isContinuation = prev.type !== 'system' && prev.username === msg.username;
                    }
                    const msgColor = msg.color || userColors[msg.username];
                    messagesArray.push(
                        createMessageElement(msg.username, msg.message, msg.timestamp,
                                             isContinuation, msgColor, msg.image, msg.replyTo)
                    );
                }
            });

            if (currentPage === 1) {
                messagesArray.reverse();
                recalcContinuations(messagesArray);
                for (let i = messagesArray.length - 1; i >= 0; i--) {
                    const el = messagesArray[i];
                    if (!el.classList.contains('system-message')) {
                        const sEl = el.querySelector('.message-sender');
                        if (sEl) { lastMessageSender = sEl.getAttribute('data-sender'); break; }
                    }
                }
            } else { recalcContinuations(messagesArray); }

            const fragment = document.createDocumentFragment();
            messagesArray.forEach(el => fragment.appendChild(el));

            if (currentPage === 1) {
                chatMessages.appendChild(fragment);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                chatMessages.insertBefore(fragment, chatMessages.firstChild);
            }
            loadMoreBtn.disabled = (data.messages.length < 20);
        });

        socket.on('user_join', (data) => {
            displaySystemMessage(`${data.username} has joined the chat`, new Date().toISOString());
            if (data.userColors) userColors = data.userColors;
            updateOnlineUsers(data.users);
        });
        socket.on('user_leave', (data) => {
            displaySystemMessage(`${data.username} has left the chat`, new Date().toISOString());
            if (data.userColors) userColors = data.userColors;
            updateOnlineUsers(data.users);
        });
        socket.on('update_users',  (data) => updateOnlineUsers(data.users));
        socket.on('update_colors', (data) => {
            if (data.userColors) { userColors = data.userColors; updateDisplayedColors(); }
        });

        loadMoreBtn.addEventListener('click', () => {
            if (!isLoading) { currentPage++; loadMessages(currentPage); }
        });
        document.getElementById('color-input').addEventListener('change', (e) => {
            socket.emit('update_color', { color: e.target.value });
        });
        dndToggle.addEventListener('change', () => {
            isDndEnabled = dndToggle.checked;
            if (socket) socket.emit('dnd_toggle', isDndEnabled);
        });

        setupImageUpload();

        chatInput.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    if (file.size > 5 * 1024 * 1024) { alert('Pasted image is too large. Max 5MB.'); return; }
                    selectedImage = file;
                    chatInput.placeholder = 'Image pasted. Type a caption (optional) and send.';
                    showImagePreview(file);
                    e.preventDefault();
                    return;
                }
            }
        });

        // Voice
        initVoice();
    }

    function recalcContinuations(elements) {
        const GAP_MS = 5 * 60 * 1000;
        let prevSender = null, prevTs = null;
        elements.forEach(el => {
            if (el.classList.contains('system-message')) { prevSender = null; prevTs = null; return; }
            const sEl = el.querySelector('.message-sender');
            if (!sEl) return;
            const sender   = sEl.getAttribute('data-sender');
            const hasReply = !!el.querySelector('.reply-thread');
            const tsRaw    = el.getAttribute('data-ts');
            const ts       = tsRaw ? parseInt(tsRaw, 10) : null;
            const sameUser = prevSender === sender;
            const smallGap = (ts && prevTs) ? (ts - prevTs) < GAP_MS : true;
            const isCont   = sameUser && smallGap && !hasReply;
            el.classList.toggle('continued-message', isCont);
            prevSender = sender; prevTs = ts || prevTs;
        });
    }

    function loadMessages(page) {
        if (isLoading) return;
        isLoading = true;
        loadingIndicator.textContent = 'Loading messages...';
        loadingIndicator.style.display = 'flex';
        socket.emit('load_messages', { page });
    }

    function setupImageUpload() {
        const imageUpload = document.getElementById('image-upload');
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('Please select an image file.'); imageUpload.value=''; return; }
            if (file.size > 5*1024*1024) { alert('Image must be under 5 MB.'); imageUpload.value=''; return; }
            selectedImage = file;
            chatInput.placeholder = `Image "${file.name}" selected. Type a caption (optional) and send.`;
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let message = replaceEmojis(chatInput.value.trim());
            if (!message && !selectedImage) return;
            if (!socket || isUploading) return;
            const currentReply = replyingTo ? { ...replyingTo } : null;

            // Clear paste preview immediately on send
            const pastePreview = document.getElementById('paste-preview');
            if (pastePreview) pastePreview.remove();

            if (selectedImage) {
                isUploading = true;
                const loader = document.createElement('div');
                loader.className = 'image-loader';
                chatForm.appendChild(loader);
                const formData = new FormData();
                formData.append('image', selectedImage);
                try {
                    const response = await fetch(SERVER_URL + '/upload', {
                        method: 'POST', body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    if (!response.ok) throw new Error(`Server ${response.status}`);
                    const ct = response.headers.get('content-type');
                    if (!ct || !ct.includes('application/json')) throw new Error('Server did not return JSON');
                    const result = await response.json();
                    if (result.success) {
                        let imagePath = result.filePath;
                        if (imagePath && !imagePath.startsWith('http'))
                            imagePath = SERVER_URL + (imagePath.startsWith('/') ? '' : '/') + imagePath;
                        socket.emit('chat_message', { message, image: imagePath, replyTo: currentReply });
                    } else { alert('Upload failed: ' + (result.message || 'unknown error')); }
                } catch (err) { alert('Upload error: ' + (err.message || err)); }
                finally {
                    isUploading = false; selectedImage = null;
                    chatInput.placeholder = 'Type your message...';
                    chatForm.removeChild(loader);
                }
            } else {
                socket.emit('chat_message', { message, replyTo: currentReply });
            }

            chatInput.value = '';
            document.getElementById('image-upload').value = '';
            chatInput.focus();
            clearReply();
        });
    }

    // ── createMessageElement ──────────────────────────────────────────────
    // Reply visual: Reddit/GitHub style — a vertical colored bar on the LEFT
    // of a block that sits INSIDE .message-content (the right column).
    // This means the bar + indented text comes off the END of the row, not
    // off the username column on the left.
    //
    // Row layout:
    //   ave  ~  │ ave: original text...   ← .reply-ref (faded)
    //           │ perfect                 ← .reply-body
    //
    // Click anywhere on a message (text OR name) to reply.
    function createMessageElement(sender, message, timestamp,
                                  isContinuation=false, color, image=null, replyTo=null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        if (isContinuation) messageDiv.classList.add('continued-message');
        if (replyTo) messageDiv.classList.add('is-reply');
        if (timestamp) messageDiv.setAttribute('data-ts', new Date(timestamp).getTime());

        const msgColor = color || userColors[sender] || null;

        // Left column: username
        const usernameArea = document.createElement('div');
        usernameArea.className = 'username-area';
        const senderEl = document.createElement('span');
        senderEl.className = 'message-sender';
        senderEl.setAttribute('data-sender', sender);
        senderEl.textContent = sender;
        if (msgColor) senderEl.style.color = msgColor;
        senderEl.style.cursor = 'pointer';
        senderEl.addEventListener('click', (e) => {
            e.stopPropagation();
            setReply({ username: sender, message: message || '', color: msgColor });
        });
        const sep = document.createElement('span');
        sep.className = 'message-separator';
        sep.textContent = ' ~ ';
        usernameArea.appendChild(senderEl);
        usernameArea.appendChild(sep);

        // Right column: message content — clicking triggers reply
        const messageContent = document.createElement('div');
        messageContent.className = 'message-content';
        if (msgColor) messageContent.style.color = msgColor;
        messageContent.style.cursor = 'pointer';
        messageContent.title = 'Click to reply';
        messageContent.addEventListener('click', () => {
            setReply({ username: sender, message: message || '', color: msgColor });
        });

        if (replyTo) {
            const replyLineColor = replyTo.color || userColors[replyTo.username] || '#555';

            // .reply-thread is the bordered block — border-left IS the vertical bar
            const thread = document.createElement('div');
            thread.className = 'reply-thread';
            thread.style.setProperty('--thread-color', replyLineColor);

            // Faded quote line: "ave: original text..."
            const refLine = document.createElement('div');
            refLine.className = 'reply-ref';
            const refAuthor = document.createElement('span');
            refAuthor.className = 'reply-ref-author';
            refAuthor.textContent = replyTo.username;
            refAuthor.style.color = replyLineColor;
            const refText = document.createElement('span');
            refText.className = 'reply-ref-text';
            const raw = replyTo.message || '[image]';
            refText.textContent = ': ' + (raw.length > 55 ? raw.substring(0,55)+'…' : raw);
            refLine.appendChild(refAuthor);
            refLine.appendChild(refText);

            // Actual reply text / image
            const replyBody = document.createElement('div');
            replyBody.className = 'reply-body';
            if (msgColor) replyBody.style.color = msgColor;
            if (message && message.length > 0) replyBody.appendChild(document.createTextNode(message));
            if (image) {
                const img = document.createElement('img');
                img.src = image; img.className = 'message-image'; img.alt = 'Shared image';
                img.onerror = () => { img.alt = 'Image failed to load'; };
                img.addEventListener('click', (e) => { e.stopPropagation(); window.open(image, '_blank'); });
                if (message && message.length > 0) replyBody.appendChild(document.createElement('br'));
                replyBody.appendChild(img);
            }

            thread.appendChild(refLine);
            thread.appendChild(replyBody);
            messageContent.appendChild(thread);
        } else {
            if (message && message.length > 0) messageContent.appendChild(document.createTextNode(message));
            if (image) {
                const img = document.createElement('img');
                img.src = image; img.className = 'message-image'; img.alt = 'Shared image';
                img.onerror = () => { img.alt = 'Image failed to load'; };
                img.addEventListener('click', (e) => { e.stopPropagation(); window.open(image, '_blank'); });
                if (message && message.length > 0) messageContent.appendChild(document.createElement('br'));
                messageContent.appendChild(img);
            }
        }

        messageDiv.appendChild(usernameArea);
        messageDiv.appendChild(messageContent);
        return messageDiv;
    }

    function createSystemMessageElement(message, timestamp) {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.textContent = message;
        return div;
    }

    function displayMessage(sender, message, timestamp, color, image=null, replyTo=null) {
        let lastDOMSender = null;
        const allMsgs = chatMessages.querySelectorAll('.message:not(.system-message)');
        if (allMsgs.length > 0) {
            const lastEl = allMsgs[allMsgs.length - 1];
            const sEl = lastEl.querySelector('.message-sender');
            if (sEl) lastDOMSender = sEl.getAttribute('data-sender');
        }
        const lastChild = chatMessages.lastElementChild;
        const lastIsSystem = lastChild && lastChild.classList.contains('system-message');
        const isContinuation = !replyTo && !lastIsSystem && (lastDOMSender === sender);
        const el = createMessageElement(sender, message, timestamp, isContinuation, color, image, replyTo);
        chatMessages.appendChild(el);
        lastMessageSender = sender;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function displaySystemMessage(message, timestamp) {
        const el = createSystemMessageElement(message, timestamp);
        chatMessages.appendChild(el);
        lastMessageSender = null;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function updateOnlineUsers(users) {
        if (!users) return;
        onlineUsers.innerHTML = '';
        users.forEach(user => {
            const item  = document.createElement('div');
            item.className = 'user-item' + (user.dnd ? ' user-dnd' : '');
            const dot   = document.createElement('span');
            dot.className  = 'user-dot';
            const label = document.createElement('span');
            label.textContent = user.username;
            if (userColors[user.username]) label.style.color = userColors[user.username];
            item.appendChild(dot);
            item.appendChild(label);
            onlineUsers.appendChild(item);
        });
    }

    function updateDisplayedColors() {
        document.querySelectorAll('.message').forEach(el => {
            const sEl = el.querySelector('.message-sender');
            if (!sEl) return;
            const s = sEl.getAttribute('data-sender');
            if (userColors[s]) {
                sEl.style.color = userColors[s];
                const c = el.querySelector('.message-content');
                if (c) c.style.color = userColors[s];
            }
        });
    }

    function isTabActive() { return !document.hidden; }

    const mp3Source = document.createElement('source');
    mp3Source.src = 'public/sounds/notif.mp3'; mp3Source.type = 'audio/mpeg';
    const wavSource = document.createElement('source');
    wavSource.src = 'public/sounds/notif.wav'; wavSource.type = 'audio/wav';
    notificationSound.appendChild(mp3Source);
    notificationSound.appendChild(wavSource);

    function playNotificationSound() {
        if (isDndEnabled) return;
        notificationSound.currentTime = 0; notificationSound.volume = 0.5;
        const p = notificationSound.play();
        if (p) p.catch(() => {});
    }

    let enableSounds = localStorage.getItem('enable_sounds') === 'true';
    const animalSounds = {};
    'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
        const s = new Audio(`public/sounds/animal/${letter}.wav`);
        s.volume = 0.2; animalSounds[letter] = s;
    });
    chatInput.addEventListener('keydown', (e) => {
        if (!enableSounds) return;
        const key = e.key.toLowerCase();
        if (animalSounds[key]) { animalSounds[key].currentTime = 0; animalSounds[key].play().catch(() => {}); }
    });

    chatInput.addEventListener('input', () => {
        const pos = chatInput.selectionStart;
        const before = chatInput.value.slice(0, pos);
        const after  = chatInput.value.slice(pos);
        const newBefore = replaceEmojis(before);
        chatInput.value = newBefore + after;
        chatInput.selectionStart = chatInput.selectionEnd = newBefore.length;
    });

    if ('Notification' in window) {
        Notification.requestPermission().then(p => {
            if (p === 'granted') console.log('Notification permission granted.');
        });
    }

    function showImagePreview(file) {
        const old = document.getElementById('paste-preview');
        if (old) old.remove();
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.createElement('img');
            img.id = 'paste-preview'; img.src = e.target.result;
            img.className = 'image-preview';
            img.style.cssText = 'max-width:120px;max-height:80px;margin:4px 8px 0;display:block;';
            chatForm.parentNode.insertBefore(img, chatForm);
        };
        reader.readAsDataURL(file);
    }

    document.addEventListener('visibilitychange', () => {});

    // ── Register service worker (PWA) ─────────────────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // ── Voice Chat ────────────────────────────────────────────────────────
    function initVoice() {
        const joinBtn    = document.getElementById('voice-join-btn');
        const membersEl  = document.getElementById('voice-members');
        const controlsEl = document.getElementById('voice-controls');
        const muteBtn    = document.getElementById('voice-mute-btn');
        const deafBtn    = document.getElementById('voice-deaf-btn');

        let inVoice = false, isMuted = false, isDeafened = false;
        let localStream = null;
        const peers    = {};   // socketId -> RTCPeerConnection
        const audioEls = {};   // socketId -> <audio>
        let voiceMembers = {}; // socketId -> { username, muted }

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function renderMembers() {
            membersEl.innerHTML = '';
            // Show self first
            if (inVoice) {
                const self = document.createElement('div');
                self.className = 'voice-member self';
                self.innerHTML = `<span class="voice-member-icon">${isMuted ? '🔇' : '🎙'}</span><span>${username} <span style="color:#555;font-size:0.65em">(you)</span></span>`;
                membersEl.appendChild(self);
            }
            Object.values(voiceMembers).forEach(({ username: u, muted }) => {
                const div = document.createElement('div');
                div.className = 'voice-member';
                div.innerHTML = `<span class="voice-member-icon">${muted ? '🔇' : '🎙'}</span><span>${u}</span>`;
                membersEl.appendChild(div);
            });
        }

        async function joinVoice() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch(e) { alert('Microphone access denied: ' + e.message); return; }
            inVoice = true;
            joinBtn.textContent = 'leave';
            joinBtn.classList.add('active');
            controlsEl.style.display = 'flex';
            renderMembers();
            socket.emit('voice_join', { username });
        }

        function leaveVoice() {
            socket.emit('voice_leave', { username });
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            Object.values(peers).forEach(pc => pc.close());
            Object.keys(peers).forEach(id => delete peers[id]);
            Object.values(audioEls).forEach(a => { a.srcObject = null; a.remove(); });
            Object.keys(audioEls).forEach(id => delete audioEls[id]);
            voiceMembers = {};
            inVoice = false; isMuted = false; isDeafened = false;
            joinBtn.textContent = 'join';
            joinBtn.classList.remove('active');
            controlsEl.style.display = 'none';
            muteBtn.classList.remove('active');
            deafBtn.classList.remove('active');
            muteBtn.textContent = '🎤 mute';
            deafBtn.textContent = '🔇 deafen';
            renderMembers();
        }

        joinBtn.addEventListener('click', () => inVoice ? leaveVoice() : joinVoice());

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            muteBtn.classList.toggle('active', isMuted);
            muteBtn.textContent = isMuted ? '🎤 unmute' : '🎤 mute';
            socket.emit('voice_mute', { muted: isMuted });
            renderMembers();
        });

        deafBtn.addEventListener('click', () => {
            isDeafened = !isDeafened;
            Object.values(audioEls).forEach(a => a.muted = isDeafened);
            deafBtn.classList.toggle('active', isDeafened);
            deafBtn.textContent = isDeafened ? '🔇 undeafen' : '🔇 deafen';
        });

        async function createPeer(remoteId, initiator) {
            if (peers[remoteId]) return peers[remoteId];
            const pc = new RTCPeerConnection(iceConfig);
            peers[remoteId] = pc;

            // Add ALL local tracks to every peer connection
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }

            pc.onicecandidate = e => {
                if (e.candidate) socket.emit('voice_ice', { to: remoteId, candidate: e.candidate });
            };

            pc.ontrack = e => {
                let audio = audioEls[remoteId];
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.muted = isDeafened;
                    // Must be added to DOM for autoplay policies
                    audio.style.display = 'none';
                    document.body.appendChild(audio);
                    audioEls[remoteId] = audio;
                }
                // Always reassign srcObject when a new track arrives
                if (e.streams && e.streams[0]) {
                    audio.srcObject = e.streams[0];
                    audio.play().catch(() => {});
                }
            };

            pc.onnegotiationneeded = async () => {
                if (initiator) {
                    try {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        socket.emit('voice_offer', { to: remoteId, offer: pc.localDescription });
                    } catch(e) { console.error('Offer error:', e); }
                }
            };

            return pc;
        }

        socket.on('voice_user_joined', async ({ socketId, username: u }) => {
            voiceMembers[socketId] = { username: u, muted: false };
            renderMembers();
            if (inVoice) {
                // We are already in voice — initiate connection to the new joiner
                await createPeer(socketId, true);
            }
        });

        socket.on('voice_current_members', async (members) => {
            // We just joined — server sends us everyone already in voice
            members.forEach(({ socketId, username: u }) => {
                voiceMembers[socketId] = { username: u, muted: false };
            });
            renderMembers();
            // Existing members will send us offers via voice_user_joined on their end
            // We just need to be ready to receive — createPeer as non-initiator
            for (const { socketId } of members) {
                await createPeer(socketId, false);
            }
        });

        socket.on('voice_offer', async ({ from, offer }) => {
            let pc = peers[from];
            if (!pc) pc = await createPeer(from, false);
            try {
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('voice_answer', { to: from, answer: pc.localDescription });
            } catch(e) { console.error('voice_offer error:', e); }
        });

        socket.on('voice_answer', async ({ from, answer }) => {
            const pc = peers[from];
            if (pc && pc.signalingState !== 'stable') {
                try { await pc.setRemoteDescription(new RTCSessionDescription(answer)); }
                catch(e) { console.error('voice_answer error:', e); }
            }
        });

        socket.on('voice_ice', async ({ from, candidate }) => {
            const pc = peers[from];
            if (pc && pc.remoteDescription) {
                try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); }
                catch(e) {}
            }
        });

        socket.on('voice_user_left', ({ socketId }) => {
            if (peers[socketId]) { peers[socketId].close(); delete peers[socketId]; }
            if (audioEls[socketId]) {
                audioEls[socketId].srcObject = null;
                audioEls[socketId].remove();
                delete audioEls[socketId];
            }
            delete voiceMembers[socketId];
            renderMembers();
        });

        socket.on('voice_mute_update', ({ socketId, muted }) => {
            if (voiceMembers[socketId]) { voiceMembers[socketId].muted = muted; renderMembers(); }
        });
    }
    </script>
</body>
</html>
