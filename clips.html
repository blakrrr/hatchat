<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hatchat - Clips</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/public/icons/icon-192.png">
<body class="clips-page">
    <header>
        <div class="logo">hatchat - 1.0.0.7</div>
        <nav><ul>
            <li><a href="clips.html">clips</a></li>
            <li><a href="index.html">homepage</a></li>
            <li><a href="chat.html">hatchat</a></li>
            <li><a href="settings.html">settings</a></li>
            <li><a href="download.html">download</a></li>
        </ul></nav>
    </header>

    <div class="clips-main">
        <div id="clips-status" class="clips-status-msg"></div>

        <!-- ── Theater Mode Player ───────────────────────────────────── -->
        <div class="clips-theater" id="clips-theater" style="display:none">
            <video class="theater-video" id="theater-video" preload="metadata"></video>
            <div class="theater-controls">
                <div class="tc-trim-wrap" title="Preview start offset from end of clip">
                    <span class="tc-trim-label">trim</span>
                    <input type="range" class="tc-trim" id="tc-trim" min="0" max="5" step="1" value="5">
                    <span class="tc-trim-val" id="tc-trim-val">60s</span>
                </div>
                <div class="tc-divider"></div>
                <button class="tc-btn" id="tc-prev">⏮</button>
                <button class="tc-btn" id="tc-play">▶</button>
                <button class="tc-btn" id="tc-next">⏭</button>
                <input type="range" class="tc-seek" id="tc-seek" min="0" max="100" value="0" step="0.1">
                <span class="tc-time" id="tc-time">0:00 / 0:00</span>
                <button class="tc-btn" id="tc-loop" title="Loop">🔁</button>
                <button class="tc-btn" id="tc-shuffle" title="Shuffle">🔀</button>
                <button class="tc-btn" id="tc-mute" title="Mute">🔊</button>
                <input type="range" class="tc-vol" id="tc-vol" min="0" max="1" step="0.05" value="1">
                <button class="tc-btn" id="tc-full" title="Fullscreen">⛶</button>
                <span class="tc-title" id="tc-title"></span>
            </div>
        </div>

        <!-- Upload -->
        <div class="clips-upload-section" id="drop-zone">
            <h2>upload a clip</h2>
            <p>nvidia clips only &nbsp;·&nbsp; mp4 · webm · mov &nbsp;|&nbsp; no size limit &nbsp;|&nbsp; last 60s kept &nbsp;|&nbsp; drag & drop or browse</p>
            <label class="clip-upload-label" for="clip-file-input">choose files</label>
            <input type="file" id="clip-file-input" class="clip-file-input"
                   accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" multiple>
            <button class="clip-submit-btn" id="clip-submit-btn" disabled>upload</button>
            <span class="clip-selected-name" id="clip-selected-name">no files selected</span>
            <div class="clip-upload-progress" id="clip-upload-progress">
                <span id="clip-progress-label">uploading...</span>
                <div class="clip-progress-bar-wrap">
                    <div class="clip-progress-bar" id="clip-progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="clips-tab-bar">
            <button class="clips-tab active" id="tab-all" onclick="switchTab('all')">all clips</button>
            <div class="clips-tab-users" id="tab-users"></div>
        </div>

        <!-- Grid -->
        <div class="clips-grid-section">
            <div id="clips-all-view">
                <div id="clips-grid-all"><div class="clips-empty">loading clips...</div></div>
            </div>
            <div id="clips-user-view" style="display:none">
                <div id="clips-grid-user"></div>
            </div>
        </div>
    </div>

<script>
    const SERVER = (window.location.protocol === 'file:')
        ? 'https://hatchat.blakrr.works'
        : window.location.origin;
    const username = localStorage.getItem('chat_username') || null;

    // ── Predefined palette for users (cycles if more than 8 users) ──
    const USER_PALETTE = [
        '#7c6af7','#e8724a','#4ab8e8','#6fcf6f','#e8d44a',
        '#e84a8f','#4ae8b8','#e8a44a'
    ];
    const userColorMap = {};
    let paletteIdx = 0;
    function getUserColor(user) {
        if (!user || user === 'unknown') return '#666';
        if (!userColorMap[user]) {
            userColorMap[user] = USER_PALETTE[paletteIdx % USER_PALETTE.length];
            paletteIdx++;
        }
        return userColorMap[user];
    }

    const fileInput     = document.getElementById('clip-file-input');
    const submitBtn     = document.getElementById('clip-submit-btn');
    const selectedName  = document.getElementById('clip-selected-name');
    const dropZone      = document.getElementById('drop-zone');
    const progressWrap  = document.getElementById('clip-upload-progress');
    const progressBar   = document.getElementById('clip-progress-bar');
    const progressLabel = document.getElementById('clip-progress-label');
    const statusMsg     = document.getElementById('clips-status');

    let selectedFiles = [];
    let allClipsData  = [];
    let activeTab     = 'all';

    // ── Theater player ───────────────────────────────────────
    const theater    = document.getElementById('clips-theater');
    const tvid       = document.getElementById('theater-video');
    const tcPrev     = document.getElementById('tc-prev');
    const tcPlay     = document.getElementById('tc-play');
    const tcNext     = document.getElementById('tc-next');
    const tcSeek     = document.getElementById('tc-seek');
    const tcTime     = document.getElementById('tc-time');
    const tcLoop     = document.getElementById('tc-loop');
    const tcShuffle  = document.getElementById('tc-shuffle');
    const tcMute     = document.getElementById('tc-mute');
    const tcVol      = document.getElementById('tc-vol');
    const tcFull     = document.getElementById('tc-full');
    const tcTitle    = document.getElementById('tc-title');

    let playlist    = [];
    let playIdx     = 0;
    let isLooping   = false;
    let isShuffled  = false;

    function fmt(s) {
        s = Math.floor(s || 0);
        return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }

    function loadTheaterClip(idx) {
        if (!playlist.length) return;
        playIdx = ((idx % playlist.length) + playlist.length) % playlist.length;
        const clip = playlist[playIdx];
        tvid.src = clip.url;
        tvid.load();
        // Seek to trim offset once duration is available
        tvid.addEventListener('loadedmetadata', function onTrimSeek() {
            if (tvid.duration > trimSecs) tvid.currentTime = tvid.duration - trimSecs;
            tvid.removeEventListener('loadedmetadata', onTrimSeek);
        });
        tvid.play().catch(()=>{});
        tcPlay.textContent = '⏸';
        const name = (clip.filename || '').replace(/\.[^.]+$/,'');
        tcTitle.textContent = name;
        tcTitle.style.color = getUserColor(clip.uploader);
        theater.style.display = '';
    }

    tvid.addEventListener('timeupdate', () => {
        if (!tvid.duration) return;
        const pct = (tvid.currentTime / tvid.duration) * 100;
        tcSeek.value = pct;
        tcTime.textContent = `${fmt(tvid.currentTime)} / ${fmt(tvid.duration)}`;
    });
    tvid.addEventListener('ended', () => {
        if (isLooping) { tvid.currentTime = 0; tvid.play().catch(()=>{}); }
        else loadTheaterClip(playIdx + 1);
    });
    tvid.addEventListener('play',  () => { tcPlay.textContent = '⏸'; });
    tvid.addEventListener('pause', () => { tcPlay.textContent = '▶'; });

    tcSeek.addEventListener('input', () => {
        if (tvid.duration) tvid.currentTime = (tcSeek.value / 100) * tvid.duration;
    });
    tcVol.addEventListener('input', () => {
        tvid.volume = tcVol.value;
        tcMute.textContent = tvid.volume === 0 ? '🔇' : '🔊';
    });
    tcMute.addEventListener('click', () => {
        tvid.muted = !tvid.muted;
        tcMute.textContent = tvid.muted ? '🔇' : '🔊';
    });
    tcPlay.addEventListener('click', () => {
        if (tvid.paused) tvid.play().catch(()=>{}); else tvid.pause();
    });
    tcPrev.addEventListener('click', () => loadTheaterClip(playIdx - 1));
    tcNext.addEventListener('click', () => loadTheaterClip(playIdx + 1));
    tcLoop.addEventListener('click', () => {
        isLooping = !isLooping;
        tcLoop.classList.toggle('active', isLooping);
    });
    tcShuffle.addEventListener('click', () => {
        isShuffled = !isShuffled;
        tcShuffle.classList.toggle('active', isShuffled);
        if (isShuffled) shuffleArr([...playlist]);
    });
    tcFull.addEventListener('click', () => {
        if (tvid.requestFullscreen) tvid.requestFullscreen();
        else if (tvid.webkitRequestFullscreen) tvid.webkitRequestFullscreen();
    });

    function shuffleArr(arr) {
        for (let i = arr.length-1; i > 0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [arr[i],arr[j]]=[arr[j],arr[i]];
        }
        return arr;
    }

    function buildPlaylist(clips) {
        playlist = isShuffled ? shuffleArr([...clips]) : [...clips];
    }

    // ── Tab switching ────────────────────────────────────────
    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.clips-tab').forEach(b => b.classList.remove('active'));
        if (tab === 'all') {
            document.getElementById('tab-all').classList.add('active');
            document.getElementById('clips-all-view').style.display = '';
            document.getElementById('clips-user-view').style.display = 'none';
            buildPlaylist(allClipsData);
        } else {
            document.querySelector(`.clips-tab[data-user="${tab}"]`)?.classList.add('active');
            document.getElementById('clips-all-view').style.display = 'none';
            document.getElementById('clips-user-view').style.display = '';
            const userClips = allClipsData.filter(c=>(c.uploader||'unknown')===tab);
            renderGrid(document.getElementById('clips-grid-user'), userClips, false);
            buildPlaylist(userClips);
        }
    }

    function buildTabBar(uploaders) {
        const tabUsers = document.getElementById('tab-users');
        tabUsers.innerHTML = '';
        uploaders.sort().forEach(user => {
            const btn = document.createElement('button');
            btn.className    = 'clips-tab';
            btn.dataset.user = user;
            btn.textContent  = user;
            btn.style.color  = getUserColor(user);
            btn.onclick = () => switchTab(user);
            tabUsers.appendChild(btn);
        });
    }

    // ── Month helpers ────────────────────────────────────────
    const MONTHS = ['january','february','march','april','may','june',
                    'july','august','september','october','november','december'];

    function getClipDate(clip) {
        const m = (clip.filename||'').match(/(\d{4})\.(\d{2})\.(\d{2})/);
        if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
        if (clip.created_at) return new Date(clip.created_at);
        return null;
    }

    function monthKey(date) {
        if (!date) return 'unknown';
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
    }

    function monthLabel(key) {
        if (key === 'unknown') return 'unknown date';
        const [yr, mo] = key.split('-');
        return `${MONTHS[parseInt(mo)-1]} ${yr}`;
    }

    function groupByMonth(clips) {
        const map = {};
        clips.forEach(c => {
            const k = monthKey(getClipDate(c));
            if (!map[k]) map[k] = [];
            map[k].push(c);
        });
        return Object.fromEntries(
            Object.entries(map).sort((a,b) => b[0].localeCompare(a[0]))
        );
    }

    function renderGrid(container, clips, showUploader) {
        container.innerHTML = '';
        if (!clips.length) { container.innerHTML='<div class="clips-empty">no clips</div>'; return; }
        const months = groupByMonth(clips);
        Object.entries(months).forEach(([key, mclips]) => {
            const section = document.createElement('div');
            section.className = 'clips-month-section';
            const heading = document.createElement('h3');
            heading.className   = 'clips-month-heading';
            heading.textContent = monthLabel(key);
            const grid = document.createElement('div');
            grid.className = 'clips-month-grid';
            mclips.forEach(c => grid.appendChild(buildClipCard(c, showUploader)));
            section.appendChild(heading);
            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    // ── File selection ───────────────────────────────────────
    fileInput.addEventListener('change', () => selectFiles([...fileInput.files]));
    function selectFiles(files) {
        const NVIDIA=/\d{4}\.\d{2}\.\d{2}\s*-\s*\d{2}\.\d{2}\.\d{2}/;
        const allowed=[], rejected=[];
        files.forEach(f => {
            if (!NVIDIA.test(f.name)) rejected.push(`${f.name} — not NVIDIA clip`);
            else                      allowed.push(f);
        });
        if (rejected.length) showStatus('Rejected: '+rejected.join(' | '),'error');
        selectedFiles = allowed;
        const totalMB = (allowed.reduce((s,f)=>s+f.size,0)/1024/1024).toFixed(1);
        selectedName.textContent = allowed.length===0 ? 'no files selected'
            : allowed.length===1 ? `${allowed[0].name} (${(allowed[0].size/1024/1024).toFixed(1)} MB)`
            : `${allowed.length} files selected — ${totalMB} MB total`;
        submitBtn.disabled = allowed.length===0;
    }

    dropZone.addEventListener('dragover', e=>{e.preventDefault();dropZone.classList.add('dragover');});
    dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop',e=>{
        e.preventDefault();dropZone.classList.remove('dragover');
        selectFiles([...e.dataTransfer.files]);
    });

    submitBtn.addEventListener('click', () => uploadQueue());

    async function uploadQueue() {
        if (!selectedFiles.length) return;
        if (!username) return showStatus('Open hatchat first to set your username.', 'error');

        const files   = [...selectedFiles];
        const total   = files.length;
        let done      = 0;
        let succeeded = 0;
        const failed  = [];

        submitBtn.disabled = true;
        progressWrap.style.display = 'block';
        progressBar.style.width = '0%';

        for (const file of files) {
            progressLabel.textContent = `uploading ${done + 1} / ${total}  —  ${file.name.slice(0,40)}`;

            const ok = await uploadOne(file);
            done++;
            progressBar.style.width = Math.round((done / total) * 100) + '%';
            if (ok) succeeded++;
            else    failed.push(file.name);
        }

        progressWrap.style.display = 'none';
        selectedFiles = [];
        selectedName.textContent = 'no files selected';
        fileInput.value = '';
        submitBtn.disabled = true;

        if (failed.length === 0) {
            showStatus(`${succeeded} clip(s) uploaded!`, 'success');
        } else {
            showStatus(`${succeeded} uploaded, ${failed.length} failed: ${failed.slice(0,3).join(', ')}${failed.length>3?'…':''}`, 'error');
        }
        loadClips();
    }

    // Upload a single file — returns true on success, false on failure.
    function uploadOne(file) {
        return new Promise(resolve => {
            const fd = new FormData();
            fd.append('uploader', username);
            fd.append('clip', file);             // field name is now 'clip' (singular)

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${SERVER}/upload-clip`);
            xhr.timeout = 10 * 60 * 1000;        // 10 min per file

            xhr.addEventListener('load', () => {
                try {
                    const r = JSON.parse(xhr.responseText);
                    resolve(r.success === true);
                } catch { resolve(false); }
            });
            xhr.addEventListener('error',   () => resolve(false));
            xhr.addEventListener('timeout', () => resolve(false));
            xhr.send(fd);
        });
    }

    async function loadClips(attempt=1) {
        const MAX=10,RETRY=8000;
        const grid=document.getElementById('clips-grid-all');
        if(attempt===1) grid.innerHTML='<div class="clips-empty">loading clips...</div>';
        else grid.innerHTML=`<div class="clips-empty">waking server... (${attempt}/${MAX})</div>`;
        try {
            const ctrl=new AbortController();
            const t=setTimeout(()=>ctrl.abort(),7000);
            const res=await fetch(`${SERVER}/api/clips`,{signal:ctrl.signal});
            clearTimeout(t);
            const data=JSON.parse(await res.text());
            allClipsData=data.clips||[];

            // Assign colors to all uploaders up front
            allClipsData.forEach(c=>getUserColor(c.uploader||'unknown'));

            grid.innerHTML='';
            if(!allClipsData.length){
                grid.innerHTML='<div class="clips-empty">no clips yet</div>';
                buildTabBar([]); return;
            }
            renderGrid(grid, allClipsData, true);
            const uploaders=[...new Set(allClipsData.map(c=>c.uploader||'unknown'))];
            buildTabBar(uploaders);
            buildPlaylist(allClipsData);
        } catch(e){
            console.warn(`Attempt ${attempt} failed:`,e.message);
            if(attempt<MAX) setTimeout(()=>loadClips(attempt+1),RETRY);
            else document.getElementById('clips-grid-all').innerHTML='<div class="clips-empty">server took too long — refresh</div>';
        }
    }

    function buildClipCard(clip, showUploader) {
        const filename=clip.filename||clip;
        const url=clip.url||`${SERVER}/uploads/clips/${encodeURIComponent(filename)}`;
        const uploaderColor=getUserColor(clip.uploader||'unknown');

        const card=document.createElement('div');
        card.className='clip-card';
        card.style.borderColor=uploaderColor+'44'; // color-tinted border

        const thumb=document.createElement('div');
        thumb.className='clip-thumb';

        // Thumbnail video (muted, no controls — just for preview frame)
        const thumbVid=document.createElement('video');
        thumbVid.src=url; thumbVid.preload='metadata'; thumbVid.muted=true;
        thumbVid.style.cssText='width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
        // Seek to trim offset when duration is known so you see the action, not the start
        thumbVid.addEventListener('loadedmetadata', () => {
            if (thumbVid.duration > trimSecs) thumbVid.currentTime = thumbVid.duration - trimSecs;
        });
        thumb.appendChild(thumbVid);

        // Play overlay — opens in theater
        const playOver=document.createElement('div');
        playOver.className='clip-play-overlay';
        playOver.innerHTML='▶';
        playOver.addEventListener('click', (e) => {
            e.stopPropagation();
            // Find this clip in the current playlist by URL match
            const idx = playlist.findIndex(p =>
                (p.url && p.url === url) ||
                (p.public_id && p.public_id === clip.public_id) ||
                (p.filename && p.filename === clip.filename)
            );
            loadTheaterClip(idx >= 0 ? idx : 0);
        });
        thumb.appendChild(playOver);
        card.appendChild(thumb);

        const info=document.createElement('div');
        info.className='clip-card-info';

        const displayName=(filename).replace(/\.[^.]+$/,'');
        const nameEl=document.createElement('p');
        nameEl.className='clip-card-name'; nameEl.textContent=displayName; nameEl.title=filename;
        info.appendChild(nameEl);

        if(showUploader&&clip.uploader){
            const uEl=document.createElement('p');
            uEl.className='clip-card-uploader';
            uEl.textContent=clip.uploader;
            uEl.style.color=uploaderColor;
            info.appendChild(uEl);
        }

        const dateMatch=filename.match(/(\d{4})\.(\d{2})\.(\d{2})\s*-\s*(\d{2})\.(\d{2})\.(\d{2})/);
        if(dateMatch){
            const[,yr,mo,dy,hr,min]=dateMatch;
            const d=document.createElement('p');
            d.className='clip-card-date'; d.textContent=`${yr}-${mo}-${dy}  ${hr}:${min}`;
            info.appendChild(d);
        } else if(clip.created_at){
            const d=document.createElement('p');
            d.className='clip-card-date'; d.textContent=new Date(clip.created_at).toLocaleString();
            info.appendChild(d);
        }

        if(username&&clip.uploader&&username.toLowerCase()===clip.uploader.toLowerCase()&&clip.public_id){
            const delBtn=document.createElement('button');
            delBtn.className='clip-delete-btn'; delBtn.textContent='✕ delete';
            delBtn.addEventListener('click',async()=>{
                if(!confirm(`Delete "${displayName}"?`)) return;
                try {
                    const r=await fetch(`${SERVER}/api/clips/${encodeURIComponent(clip.public_id)}`,
                        {method:'DELETE',headers:{'Content-Type':'application/json'},
                         body:JSON.stringify({uploader:username})});
                    const d=await r.json();
                    if(d.success){showStatus('Clip deleted.','success');loadClips();}
                    else showStatus('Delete failed: '+d.message,'error');
                } catch(e){showStatus('Delete error: '+e.message,'error');}
            });
            info.appendChild(delBtn);
        }

        card.appendChild(info);
        return card;
    }

    function showStatus(msg,type){
        statusMsg.textContent=msg; statusMsg.className=`clips-status-msg ${type}`;
        clearTimeout(statusMsg._timer);
        statusMsg._timer=setTimeout(()=>{statusMsg.className='clips-status-msg';},7000);
    }

    // ── Trim slider ──────────────────────────────────────────
    // Maps slider position 0-5 to preview-start offset (seconds from end).
    // Default is position 5 = 60s. Changing it re-seeks all loaded thumbs.
    const TRIM_MAP = [15, 20, 25, 30, 45, 60];
    let trimSecs = 60;
    const tcTrim    = document.getElementById('tc-trim');
    const tcTrimVal = document.getElementById('tc-trim-val');

    tcTrim.addEventListener('input', () => {
        trimSecs = TRIM_MAP[parseInt(tcTrim.value)];
        tcTrimVal.textContent = trimSecs + 's';
        document.querySelectorAll('.clip-thumb video').forEach(v => {
            if (v.readyState >= 1 && v.duration > trimSecs) {
                v.currentTime = v.duration - trimSecs;
            }
        });
        if (tvid.duration && tvid.duration > trimSecs) {
            tvid.currentTime = tvid.duration - trimSecs;
        }
    });

    // ── Scroll-shrink theater ────────────────────────────────
    window.addEventListener('scroll', () => {
        const theater = document.getElementById('clips-theater');
        if (theater.style.display === 'none') return;
        const scrollY = window.scrollY || window.pageYOffset;
        const vh = window.innerHeight / 100;
        // shrinks faster (0.16) and bottoms out smaller (12vh)
        const maxH = Math.max(12 * vh, 55 * vh - scrollY * 0.16);
        document.getElementById('theater-video').style.maxHeight = maxH + 'px';
    });

    // ── Click theater video to pause / play ──────────────────
    document.getElementById('theater-video').addEventListener('click', () => {
        if (tvid.paused) tvid.play().catch(()=>{});
        else tvid.pause();
    });

    // ── Tab-away pause ───────────────────────────────────────
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) tvid.pause();
    });

    // ── Register service worker (PWA) ────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    loadClips();
</script>
</body>
</html>
