<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hatchat - Clips</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/public/icons/icon-192.png">
<script src="hatchat-shared.js"></script>
<style>
  /* Online panel coexists with clips — panel is on the right, clips flow left */
  body.has-online-panel .clips-main { margin-right: 164px; }
  /* Theater FS: panel slides away so video gets full width */
  body.has-online-panel .theater-fs ~ #hc-online-panel,
  .theater-fs + #hc-online-panel,
  body.has-online-panel:has(.theater-fs) #hc-online-panel { display: none; }
  /* Non-FS theater: panel stays but theater respects the margin */
  body.has-online-panel .clips-theater:not(.theater-fs) { margin-right: 0; }
</style>
</head>
<body class="clips-page">

<header>
  <div class="logo">hatchat - 1.0.3.0</div>
  <nav>
    <ul>
      <li><a href="clips.html">clips</a></li>
      <li><a href="index.html">homepage</a></li>
      <li><a href="chat.html">hatchat</a></li>
      <li><a href="settings.html">settings</a></li>
      <li><a href="download.html">download</a></li>
    </ul>
  </nav>
</header>

<div class="clips-main">
  <div id="clips-status" class="clips-status-msg"></div>

  <!-- Theater Mode -->
  <div class="clips-theater" id="clips-theater" style="display:none">
    <video class="theater-video" id="theater-video" preload="metadata"></video>
    <div class="theater-controls">
      <div class="tc-trim-wrap" title="Trim: 15s · 20s · 30s · 45s · 60s (full)">
        <span class="tc-trim-label">trim</span>
        <input type="range" class="tc-trim" id="tc-trim" min="0" max="4" step="1" value="4">
        <span class="tc-trim-val" id="tc-trim-val">60s</span>
      </div>
      <button class="tc-btn" id="tc-prev">⏮</button>
      <button class="tc-btn" id="tc-play">▶</button>
      <button class="tc-btn" id="tc-next">⏭</button>
      <input type="range" class="tc-seek" id="tc-seek" min="0" max="100" step="0.1" value="0">
      <span class="tc-time" id="tc-time">0:00 / 0:00</span>
      <button class="tc-btn" id="tc-loop">🔁</button>
      <button class="tc-btn" id="tc-shuffle">🔀</button>
      <button class="tc-btn" id="tc-mute">🔊</button>
      <input type="range" class="tc-vol" id="tc-vol" min="0" max="1" step="0.05" value="1">
      <button class="tc-btn" id="tc-full">⛶</button>
      <span class="tc-title" id="tc-title"></span>
    </div>
  </div>

  <!-- Upload -->
  <div class="clips-upload-section" id="drop-zone">
    <h2>upload a clip</h2>
    <p>nvidia clips only · mp4 · webm · mov · no size limit · last 60s kept · drag &amp; drop or browse</p>
    <label class="clip-upload-label" for="clip-file-input">choose files</label>
    <input type="file" id="clip-file-input" class="clip-file-input" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" multiple>
    <button class="clip-submit-btn" id="clip-submit-btn" disabled>upload</button>
    <span class="clip-selected-name" id="clip-selected-name">no files selected</span>
    <div class="clip-upload-progress" id="clip-upload-progress">
      <span id="clip-progress-label">uploading...</span>
      <div class="clip-progress-bar-wrap">
        <div class="clip-progress-bar" id="clip-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="clips-tab-bar">
    <button class="clips-tab active" id="tab-all" onclick="switchTab('all')">all clips</button>
    <div class="clips-tab-users" id="tab-users"></div>
  </div>

  <!-- Grid -->
  <div class="clips-grid-section">
    <div id="clips-all-view"><div id="clips-grid-all"><div class="clips-empty">loading clips...</div></div></div>
    <div id="clips-user-view" style="display:none"><div id="clips-grid-user"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
<script>
// SERVER is defined in hatchat-shared.js
const username = localStorage.getItem('chat_username') || null;
let allClipsData = [];
let activeTab = 'all', trimSecs = 60;

// ── Color palette ────────────────────────────────────────────────────────
const USER_PALETTE = ['#7c6af7','#e8724a','#4ab8e8','#6fcf6f','#e8d44a','#e84a8f','#4ae8b8','#e8a44a'];
const userColorMap = {};
let paletteIdx = 0;

async function fetchAndCacheUserColors() {
  try {
    const r = await fetch(`${SERVER}/api/all-users`);
    const d = await r.json();
    if (d.success) {
      d.users.forEach(u => { if (u.color) userColorMap[u.username.toLowerCase()] = u.color; });
    }
  } catch(e) { /* fall back to palette */ }
}

function getUserColor(u) {
  if (!u || u === 'unknown') return '#666';
  const key = u.toLowerCase();
  if (!userColorMap[key]) userColorMap[key] = USER_PALETTE[paletteIdx++ % USER_PALETTE.length];
  return userColorMap[key];
}

// ── Cloudinary poster thumbnail ──────────────────────────────────────────
// Takes a Cloudinary video URL and returns a JPEG thumbnail of the first frame.
// e.g. .../upload/hatchat-clips/foo.mp4  →  .../upload/so_0,w_400,h_225,c_fill,q_auto/hatchat-clips/foo.jpg
function cloudinaryPoster(url) {
  return url
    .replace('/upload/', '/upload/so_0,w_400,h_225,c_fill,q_auto:low/')
    .replace(/\.(mp4|webm|mov|avi|mkv)(\?.*)?$/i, '.jpg');
}

// ── Grid builder ─────────────────────────────────────────────────────────
// Renders clips into `container` grouped by month (e.g. "march 2026 ───")
// In "all" view showUploader=true; in per-user tab showUploader=false.
function renderGrid(container, clips, showUploader) {
  container.innerHTML = '';
  if (!clips.length) { container.innerHTML = '<div class="clips-empty">no clips</div>'; return; }

  // Group by month_key (YYYY-MM), preserving the already-sorted order
  const months = [];
  const monthMap = {};
  clips.forEach(clip => {
    const key = clip.month_key || 'unknown';
    if (!monthMap[key]) { monthMap[key] = []; months.push(key); }
    monthMap[key].push(clip);
  });

  // Format month key → readable label
  function fmtMonth(key) {
    if (key === 'unknown') return 'unknown date';
    const [y, m] = key.split('-');
    const names = ['january','february','march','april','may','june','july','august','september','october','november','december'];
    return `${names[parseInt(m,10)-1]} ${y}`;
  }

  months.forEach(key => {
    const section = document.createElement('div');
    section.className = 'clips-month-section';

    const heading = document.createElement('h3');
    heading.className = 'clips-month-heading';
    heading.textContent = fmtMonth(key) + ' ───────────────';
    section.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'clips-month-grid';
    monthMap[key].forEach(clip => buildCard(grid, clip, showUploader));
    // Apply current zoom column count immediately after creating grid
    if (window._hcReapplyZoom) window._hcReapplyZoom();
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function buildCard(grid, clip, showUploader) {
    const card = document.createElement('div');
    card.className = 'clip-card';
    card.style.borderColor = getUserColor(clip.uploader) + 'cc';

    const thumb = document.createElement('div');
    thumb.className = 'clip-thumb';

    const poster = document.createElement('img');
    poster.src = cloudinaryPoster(clip.url);
    poster.alt = clip.filename;
    poster.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
    poster.onerror = () => { poster.style.background = '#111'; poster.style.opacity = '0'; };
    thumb.appendChild(poster);

    const overlay = document.createElement('div');
    overlay.className = 'clip-play-overlay';
    overlay.innerHTML = '▶';
    overlay.addEventListener('click', e => { e.stopPropagation(); loadTheaterClip(clip); });
    thumb.appendChild(overlay);
    card.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'clip-card-info';

    const nameEl = document.createElement('p');
    nameEl.className = 'clip-card-name';
    nameEl.textContent = clip.filename.replace(/\.[^.]+$/, '');
    info.appendChild(nameEl);

    if (showUploader && clip.uploader) {
      const uEl = document.createElement('p');
      uEl.className = 'clip-card-uploader';
      uEl.textContent = clip.uploader;
      uEl.style.color = getUserColor(clip.uploader);
      info.appendChild(uEl);
    }

    if (username && clip.uploader && clip.uploader.toLowerCase() === username.toLowerCase()) {
      const delBtn = document.createElement('button');
      delBtn.className = 'clip-delete-btn';
      delBtn.textContent = '🗑 delete';
      delBtn.title = 'Delete this clip';
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete "${clip.filename.replace(/\.[^.]+$/, '')}"?`)) return;
        delBtn.disabled = true; delBtn.textContent = 'deleting…';
        try {
          const r = await fetch(`${SERVER}/api/clips/${encodeURIComponent(clip.public_id)}`, {
            method: 'DELETE', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ uploader: username })
          });
          const d = await r.json();
          if (d.success) { card.remove(); showStatus('clip deleted', 'success'); }
          else { showStatus(d.message || 'delete failed', 'error'); delBtn.disabled = false; delBtn.textContent = '🗑 delete'; }
        } catch(err) { showStatus('delete error: ' + err.message, 'error'); delBtn.disabled = false; delBtn.textContent = '🗑 delete'; }
      });
      info.appendChild(delBtn);
    }
    card.appendChild(info);
    grid.appendChild(card);
}

// ── Load clips ───────────────────────────────────────────────────────────
async function loadClips() {
  const grid = document.getElementById('clips-grid-all');
  grid.innerHTML = '<div class="clips-empty">loading clips...</div>';
  await fetchAndCacheUserColors();
  try {
    const res  = await fetch(`${SERVER}/api/clips`);
    const data = await res.json();
    allClipsData = data.clips || [];
    renderGrid(grid, allClipsData, true);
    buildTabBar([...new Set(allClipsData.map(c => c.uploader || 'unknown'))]);
  } catch(e) {
    console.error(e);
    grid.innerHTML = '<div class="clips-empty">server error — is Render awake?</div>';
  }
}

// ── Tab bar ──────────────────────────────────────────────────────────────
function buildTabBar(uploaders) {
  const bar = document.getElementById('tab-users');
  bar.innerHTML = '';
  uploaders.sort().forEach(user => {
    const btn = document.createElement('button');
    btn.className = 'clips-tab';
    btn.dataset.user = user;
    btn.textContent = user;
    btn.style.color = getUserColor(user);
    btn.onclick = () => switchTab(user);
    bar.appendChild(btn);
  });
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.clips-tab').forEach(b => b.classList.remove('active'));
  const allView  = document.getElementById('clips-all-view');
  const userView = document.getElementById('clips-user-view');
  if (tab === 'all') {
    document.getElementById('tab-all').classList.add('active');
    allView.style.display  = '';
    userView.style.display = 'none';
    renderGrid(document.getElementById('clips-grid-all'), allClipsData, true);
  } else {
    document.querySelector(`.clips-tab[data-user="${tab}"]`)?.classList.add('active');
    allView.style.display  = 'none';
    userView.style.display = '';
    renderGrid(document.getElementById('clips-grid-user'), allClipsData.filter(c => c.uploader === tab), false);
  }
}

loadClips();

// ── Socket: live notifications for new clips & color updates ─────────────
(function() {
  const sock = io(SERVER, { query: { username: username || 'clips-viewer', color: '#000' }, reconnection: true });
  // Init the shared online panel
  if (window.hcInitOnlinePanel) window.hcInitOnlinePanel(sock);
  // NOTE: force_reload removed here — it was interrupting batch uploads.
  // The upload handler triggers its own reload after all files complete.
  sock.on('clip_uploaded', (data) => {
    if (data.uploader && data.uploader !== username) {
      if (window.hcNotify) window.hcNotify(`📎 ${data.uploader} uploaded a clip`);
      loadClips();
    }
  });
  sock.on('update_colors', (data) => {
    if (data.userColors) {
      Object.assign(userColorMap, data.userColors);
      renderGrid(document.getElementById('clips-grid-all'), allClipsData, true);
      buildTabBar([...new Set(allClipsData.map(c => c.uploader || 'unknown'))]);
    }
  });
  sock.on('user_renamed', (data) => {
    allClipsData.forEach(c => { if (c.uploader === data.oldUsername) c.uploader = data.newUsername; });
    renderGrid(document.getElementById('clips-grid-all'), allClipsData, true);
    buildTabBar([...new Set(allClipsData.map(c => c.uploader || 'unknown'))]);
  });
})();

// ── Theater player ───────────────────────────────────────────────────────
const tvid     = document.getElementById('theater-video');
const tcPlay   = document.getElementById('tc-play');
const tcPrev   = document.getElementById('tc-prev');
const tcNext   = document.getElementById('tc-next');
const tcSeek   = document.getElementById('tc-seek');
const tcTime   = document.getElementById('tc-time');
const tcLoop   = document.getElementById('tc-loop');
const tcShuf   = document.getElementById('tc-shuffle');
const tcMute   = document.getElementById('tc-mute');
const tcVol    = document.getElementById('tc-vol');
const tcFull   = document.getElementById('tc-full');
const tcTitle  = document.getElementById('tc-title');
const tcTrim   = document.getElementById('tc-trim');
const tcTrimVal= document.getElementById('tc-trim-val');

let isLoop = false, isShuffle = false, theaterIdx = 0;

function fmtTime(s) {
  if (!isFinite(s) || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return `${m}:${ss.toString().padStart(2, '0')}`;
}

// Trim slider: 5 positions → 15, 20, 30, 45, 60s
const TRIM_STEPS = [15, 20, 30, 45, 60];
tcTrim.addEventListener('input', () => {
  const idx = Math.min(parseInt(tcTrim.value), TRIM_STEPS.length - 1);
  trimSecs = TRIM_STEPS[idx];
  tcTrimVal.textContent = trimSecs + 's';
});

// When video metadata loads, seek to (duration - trimSecs) for the preview
tvid.addEventListener('loadedmetadata', () => {
  tcSeek.max = tvid.duration;
  if (trimSecs > 0 && tvid.duration > trimSecs) {
    tvid.currentTime = tvid.duration - trimSecs;
  }
  updateTime();
});

tvid.addEventListener('timeupdate', () => {
  if (!tvid.seeking) tcSeek.value = tvid.currentTime;
  updateTime();
});

tvid.addEventListener('play',  () => { tcPlay.textContent = '⏸'; });
tvid.addEventListener('pause', () => { tcPlay.textContent = '▶'; });

// Auto-advance to next clip when one finishes
tvid.addEventListener('ended', () => {
  if (isLoop) { tvid.currentTime = 0; tvid.play(); }
  else advanceTheater(1);
});

function updateTime() {
  tcTime.textContent = `${fmtTime(tvid.currentTime)} / ${fmtTime(tvid.duration)}`;
}

tcSeek.addEventListener('input', () => { tvid.currentTime = parseFloat(tcSeek.value); });

tcPlay.addEventListener('click', () => {
  tvid.paused ? tvid.play() : tvid.pause();
});

// Click the video itself to pause/play
tvid.addEventListener('click', () => { tvid.paused ? tvid.play() : tvid.pause(); });

tcMute.addEventListener('click', () => {
  tvid.muted = !tvid.muted;
  tcMute.textContent = tvid.muted ? '🔇' : '🔊';
  if (!tvid.muted) tcVol.value = tvid.volume || 1;
});
tcVol.addEventListener('input', () => {
  tvid.volume = parseFloat(tcVol.value);
  tvid.muted  = (tvid.volume === 0);
  tcMute.textContent = tvid.muted ? '🔇' : '🔊';
});

tcLoop.addEventListener('click', () => {
  isLoop = !isLoop;
  tcLoop.classList.toggle('active', isLoop);
});
tcShuf.addEventListener('click', () => {
  isShuffle = !isShuffle;
  tcShuf.classList.toggle('active', isShuffle);
});

// tc-full is handled by the custom FS block below — do not use browser fullscreen

tcPrev.addEventListener('click', () => advanceTheater(-1));
tcNext.addEventListener('click', () => advanceTheater(1));

function advanceTheater(dir) {
  const clips = activeTab === 'all'
    ? allClipsData
    : allClipsData.filter(c => c.uploader === activeTab);
  if (!clips.length) return;
  if (isShuffle) {
    theaterIdx = Math.floor(Math.random() * clips.length);
  } else {
    theaterIdx = (theaterIdx + dir + clips.length) % clips.length;
  }
  loadTheaterClip(clips[theaterIdx]);
}

function loadTheaterClip(clip) {
  // Find index in the currently visible list
  const clips = activeTab === 'all'
    ? allClipsData
    : allClipsData.filter(c => c.uploader === activeTab);
  theaterIdx = clips.findIndex(c => c.url === clip.url);
  if (theaterIdx < 0) theaterIdx = 0;

  tvid.src = clip.url;
  tvid.load();
  tvid.play().catch(() => {});
  tcTitle.textContent = clip.filename.replace(/\.[^.]+$/, '');
  tcSeek.value = 0;
  const theaterEl = document.getElementById('clips-theater');
  const wasHidden = theaterEl.style.display === 'none';
  theaterEl.style.display = '';
  // Only scroll into view when first opening the theater, not on auto-advance
  if (wasHidden) theaterEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Upload handler ───────────────────────────────────────────────────────
const fileInput    = document.getElementById('clip-file-input');
const submitBtn    = document.getElementById('clip-submit-btn');
const selectedLbl  = document.getElementById('clip-selected-name');
const progressWrap = document.getElementById('clip-upload-progress');
const progressBar  = document.getElementById('clip-progress-bar');
const progressLbl  = document.getElementById('clip-progress-label');
const dropZone     = document.getElementById('drop-zone');
const statusEl     = document.getElementById('clips-status');

let pendingFiles = [];

function setFiles(files) {
  pendingFiles = Array.from(files).filter(f => /\.(mp4|webm|mov)$/i.test(f.name));
  if (!pendingFiles.length) {
    selectedLbl.textContent = 'no valid files (.mp4 / .webm / .mov)';
    submitBtn.disabled = true;
  } else {
    selectedLbl.textContent = pendingFiles.length === 1
      ? pendingFiles[0].name
      : `${pendingFiles.length} files selected`;
    submitBtn.disabled = false;
  }
}

fileInput.addEventListener('change', e => setFiles(e.target.files));
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); setFiles(e.dataTransfer.files); });

submitBtn.addEventListener('click', async () => {
  if (!pendingFiles.length) return;

  // Must be logged in — check localStorage token
  const token = localStorage.getItem('hc_token');
  const uploader = localStorage.getItem('chat_username');
  if (!token || !uploader) {
    showStatus('you must be logged in on hatchat before uploading', 'error');
    return;
  }

  submitBtn.disabled = true;
  progressWrap.style.display = 'block';
  let done = 0, failed = 0;

  for (const file of pendingFiles) {
    const pct = Math.round((done / pendingFiles.length) * 100);
    progressBar.style.width = pct + '%';
    progressLbl.textContent = `uploading ${file.name} (${done + 1}/${pendingFiles.length})…`;

    try {
      const fd = new FormData();
      fd.append('clip', file);
      fd.append('uploader', uploader);

      // 8 minute timeout — Render can be slow processing large videos through Cloudinary
      const controller = new AbortController();
      const tid = setTimeout(() => controller.abort(), 8 * 60 * 1000);

      const res  = await fetch(`${SERVER}/upload-clip`, { method: 'POST', body: fd, signal: controller.signal });
      clearTimeout(tid);
      const data = await res.json();
      if (!data.success) {
        console.warn('Upload failed for', file.name, ':', data.message);
        failed++;
      }
    } catch(e) {
      console.error('Upload error for', file.name, e);
      if (e.name === 'AbortError') progressLbl.textContent = `timed out on ${file.name} — skipping`;
      failed++;
    }
    done++;
  }

  progressBar.style.width = '100%';
  progressLbl.textContent = failed
    ? `done — ${done - failed}/${done} succeeded`
    : `done! reloading…`;

  if (!failed && window.hcNotify) {
    window.hcNotify(`📎 ${uploader} uploaded ${done} clip${done !== 1 ? 's' : ''}`);
  }

  pendingFiles = [];
  fileInput.value = '';
  selectedLbl.textContent = 'no files selected';
  submitBtn.disabled = false;
  setTimeout(async () => {
    progressWrap.style.display = 'none';
    progressBar.style.width = '0';
    // Hard reload to get fresh clip list sorted correctly
    location.reload();
  }, 1800);
});

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = `clips-status-msg ${type}`;
  setTimeout(() => { statusEl.className = 'clips-status-msg'; statusEl.textContent = ''; }, 4000);
}
// ── F key: custom fullscreen ─────────────────────────────────────────────
(function() {
  let isFS = false;
  const theater = document.getElementById('clips-theater');
  const vid     = document.getElementById('theater-video');
  const fsBtn   = document.getElementById('tc-full');

  function enterFS() {
    if (!theater || theater.style.display === 'none') return;
    isFS = true;
    window.scrollTo({ top: 0, behavior: 'instant' });
    theater.classList.add('theater-fs');
    document.body.style.overflow = 'hidden';
    // Hide online panel so theater gets full width
    const panel = document.getElementById('hc-online-panel');
    if (panel) panel.style.display = 'none';
    vid.style.maxHeight = window.scrollY > 80 ? '28vh' : '65vh';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        vid.style.maxHeight = 'calc(100vh - 58px)';
      });
    });
    if (fsBtn) fsBtn.textContent = '✕';
  }

  function exitFS() {
    isFS = false;
    theater.classList.remove('theater-fs');
    document.body.style.overflow = '';
    // Restore online panel
    const panel = document.getElementById('hc-online-panel');
    if (panel) panel.style.display = '';
    vid.style.maxHeight = '65vh';
    if (fsBtn) fsBtn.textContent = '⛶';
  }

  function toggleFS() { isFS ? exitFS() : enterFS(); }

  window.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') {
      if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      toggleFS();
    }
    if (e.key === 'Escape' && isFS) exitFS();
  });

  if (fsBtn) fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFS(); });
})();

// ── Theater shrink on scroll ─────────────────────────────────────────────
(function() {
  const vid = document.getElementById('theater-video');
  window.addEventListener('scroll', () => {
    if (!vid) return;
    const scrolled = window.scrollY > 80;
    vid.style.maxHeight = scrolled ? '28vh' : '65vh';
  }, { passive: true });
})();
</script>
</body>
</html>
