<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hatchat - Clips</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="clips-page">
    <header>
        <div class="logo">hatchat - 1.0.0.7</div>
        <nav><ul>
            <li><a href="clips.html">clips</a></li>
            <li><a href="index.html">homepage</a></li>
            <li><a href="chat.html">hatchat</a></li>
            <li><a href="settings.html">settings</a></li>
        </ul></nav>
    </header>

    <div class="clips-main">
        <div id="clips-status" class="clips-status-msg"></div>

        <!-- Upload -->
        <div class="clips-upload-section" id="drop-zone">
            <h2>upload a clip</h2>
            <p>nvidia clips only &nbsp;·&nbsp; mp4 · webm · mov &nbsp;|&nbsp; max 50 MB per file &nbsp;|&nbsp; trimmed to last 30s &nbsp;|&nbsp; drag & drop or browse</p>
            <label class="clip-upload-label" for="clip-file-input">choose files</label>
            <input type="file" id="clip-file-input" class="clip-file-input"
                   accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" multiple>
            <button class="clip-submit-btn" id="clip-submit-btn" disabled>upload</button>
            <span class="clip-selected-name" id="clip-selected-name">no files selected</span>
            <div class="clip-upload-progress" id="clip-upload-progress">
                <span id="clip-progress-label">uploading...</span>
                <div class="clip-progress-bar-wrap">
                    <div class="clip-progress-bar" id="clip-progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- Tab Bar: All Clips + per-person tabs -->
        <div class="clips-tab-bar">
            <button class="clips-tab active" id="tab-all" onclick="switchTab('all')">all clips</button>
            <div class="clips-tab-users" id="tab-users"></div>
        </div>

        <!-- Viewer: master playlist controls -->
        <div class="clips-player-bar" id="clips-player-bar" style="display:none">
            <button class="cpb-btn" id="cpb-prev" title="Previous clip">⏮</button>
            <button class="cpb-btn" id="cpb-play" title="Play / Pause">▶</button>
            <button class="cpb-btn" id="cpb-next" title="Next clip">⏭</button>
            <button class="cpb-btn" id="cpb-loop" title="Loop">🔁</button>
            <button class="cpb-btn" id="cpb-shuffle" title="Shuffle">🔀</button>
            <span class="cpb-label" id="cpb-label">— / —</span>
        </div>

        <!-- Clips Grid -->
        <div class="clips-grid-section">
            <div id="clips-all-view">
                <div class="clips-grid" id="clips-grid-all">
                    <div class="clips-empty">loading clips...</div>
                </div>
            </div>
            <div id="clips-user-view" style="display:none">
                <div class="clips-grid" id="clips-grid-user"></div>
            </div>
        </div>
    </div>

<script>
    const SERVER   = 'https://averrgy-github-io.onrender.com';
    const username = localStorage.getItem('chat_username') || null;

    const fileInput     = document.getElementById('clip-file-input');
    const submitBtn     = document.getElementById('clip-submit-btn');
    const selectedName  = document.getElementById('clip-selected-name');
    const dropZone      = document.getElementById('drop-zone');
    const progressWrap  = document.getElementById('clip-upload-progress');
    const progressBar   = document.getElementById('clip-progress-bar');
    const progressLabel = document.getElementById('clip-progress-label');
    const statusMsg     = document.getElementById('clips-status');
    const playerBar     = document.getElementById('clips-player-bar');

    let selectedFiles = [];
    let allClipsData  = [];
    let activeTab     = 'all';

    // ── Playlist state ───────────────────────────────────────
    let playlist    = [];   // [{video el, clip}] in current view order
    let playIdx     = 0;
    let isLooping   = false;
    let isShuffled  = false;

    const cpbPrev    = document.getElementById('cpb-prev');
    const cpbPlay    = document.getElementById('cpb-play');
    const cpbNext    = document.getElementById('cpb-next');
    const cpbLoop    = document.getElementById('cpb-loop');
    const cpbShuffle = document.getElementById('cpb-shuffle');
    const cpbLabel   = document.getElementById('cpb-label');

    function buildPlaylist() {
        const view = activeTab === 'all'
            ? document.getElementById('clips-grid-all')
            : document.getElementById('clips-grid-user');
        const videos = [...view.querySelectorAll('.clip-card video')];
        playlist = videos.map((v, i) => ({ video: v, idx: i }));
        if (isShuffled) shuffleArray(playlist);
        playerBar.style.display = playlist.length ? 'flex' : 'none';
        updateLabel();
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function updateLabel() {
        cpbLabel.textContent = playlist.length
            ? `${playIdx + 1} / ${playlist.length}`
            : '— / —';
    }

    function playClip(idx) {
        // Pause current
        playlist.forEach(p => { p.video.pause(); });
        playIdx = ((idx % playlist.length) + playlist.length) % playlist.length;
        const entry = playlist[playIdx];
        entry.video.currentTime = 0;
        entry.video.play().catch(() => {});
        entry.video.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        cpbPlay.textContent = '⏸';
        updateLabel();
        // Auto-advance when done
        entry.video.onended = () => {
            if (isLooping) { entry.video.currentTime = 0; entry.video.play().catch(()=>{}); }
            else playClip(playIdx + 1);
        };
    }

    cpbPrev.addEventListener('click',    () => playClip(playIdx - 1));
    cpbNext.addEventListener('click',    () => playClip(playIdx + 1));
    cpbPlay.addEventListener('click',    () => {
        if (!playlist.length) return;
        const v = playlist[playIdx].video;
        if (v.paused) { v.play().catch(()=>{}); cpbPlay.textContent = '⏸'; }
        else          { v.pause();               cpbPlay.textContent = '▶'; }
    });
    cpbLoop.addEventListener('click', () => {
        isLooping = !isLooping;
        cpbLoop.classList.toggle('active', isLooping);
    });
    cpbShuffle.addEventListener('click', () => {
        isShuffled = !isShuffled;
        cpbShuffle.classList.toggle('active', isShuffled);
        buildPlaylist();
    });

    // ── Tab switching ────────────────────────────────────────
    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.clips-tab').forEach(b => b.classList.remove('active'));
        if (tab === 'all') {
            document.getElementById('tab-all').classList.add('active');
            document.getElementById('clips-all-view').style.display = '';
            document.getElementById('clips-user-view').style.display = 'none';
        } else {
            document.querySelector(`.clips-tab[data-user="${tab}"]`)?.classList.add('active');
            document.getElementById('clips-all-view').style.display = 'none';
            document.getElementById('clips-user-view').style.display = '';
            renderUserGrid(tab);
        }
        buildPlaylist();
    }

    function renderUserGrid(user) {
        const grid = document.getElementById('clips-grid-user');
        grid.innerHTML = '';
        const clips = allClipsData.filter(c => (c.uploader || 'unknown') === user);
        // Group by month within user's clips
        const months = groupByMonth(clips);
        renderMonthGroups(grid, months, false);
    }

    function buildTabBar(uploaders) {
        const tabUsers = document.getElementById('tab-users');
        tabUsers.innerHTML = '';
        uploaders.sort().forEach(user => {
            const btn = document.createElement('button');
            btn.className    = 'clips-tab';
            btn.dataset.user = user;
            btn.textContent  = user;
            btn.onclick      = () => switchTab(user);
            tabUsers.appendChild(btn);
        });
    }

    // ── Month helpers ────────────────────────────────────────
    const MONTHS = ['january','february','march','april','may','june',
                    'july','august','september','october','november','december'];

    function getClipDate(clip) {
        const m = (clip.filename || '').match(/(\d{4})\.(\d{2})\.(\d{2})/);
        if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
        if (clip.created_at) return new Date(clip.created_at);
        return null;
    }

    function monthKey(date) {
        if (!date) return 'unknown';
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
    }

    function monthLabel(key) {
        if (key === 'unknown') return 'unknown date';
        const [yr, mo] = key.split('-');
        return `${MONTHS[parseInt(mo)-1]} ${yr}`;
    }

    function groupByMonth(clips) {
        const map = {};
        clips.forEach(c => {
            const d = getClipDate(c);
            const k = monthKey(d);
            if (!map[k]) map[k] = [];
            map[k].push(c);
        });
        // Sort month keys newest-first
        return Object.fromEntries(
            Object.entries(map).sort((a, b) => b[0].localeCompare(a[0]))
        );
    }

    function renderMonthGroups(container, months, showUploader) {
        Object.entries(months).forEach(([key, clips]) => {
            const section = document.createElement('div');
            section.className = 'clips-month-section';
            const heading = document.createElement('h3');
            heading.className   = 'clips-month-heading';
            heading.textContent = monthLabel(key);
            section.appendChild(heading);
            const grid = document.createElement('div');
            grid.className = 'clips-month-grid';
            clips.forEach(c => grid.appendChild(buildClipCard(c, showUploader)));
            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    // ── File selection ───────────────────────────────────────
    fileInput.addEventListener('change', () => selectFiles([...fileInput.files]));

    function selectFiles(files) {
        const MAX    = 50 * 1024 * 1024;
        const NVIDIA = /\d{4}\.\d{2}\.\d{2}\s*-\s*\d{2}\.\d{2}\.\d{2}/;
        const allowed = [], rejected = [];
        files.forEach(f => {
            if (!NVIDIA.test(f.name))       rejected.push(`${f.name} — not an NVIDIA clip`);
            else if (f.size > MAX)          rejected.push(`${f.name} — over 50 MB`);
            else                            allowed.push(f);
        });
        if (rejected.length) showStatus('Rejected: ' + rejected.join(' | '), 'error');
        selectedFiles = allowed;
        selectedName.textContent = allowed.length === 0 ? 'no files selected'
            : allowed.length === 1 ? allowed[0].name : `${allowed.length} files selected`;
        submitBtn.disabled = allowed.length === 0;
    }

    // ── Drag & Drop ──────────────────────────────────────────
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault(); dropZone.classList.remove('dragover');
        selectFiles([...e.dataTransfer.files]);
    });

    // ── Upload ───────────────────────────────────────────────
    submitBtn.addEventListener('click', () => {
        if (!selectedFiles.length) return;
        if (!username) return showStatus('Open hatchat first to set your username.', 'error');

        const formData = new FormData();
        formData.append('uploader', username);
        selectedFiles.forEach(f => formData.append('clips', f));

        const xhr = new XMLHttpRequest();
        progressWrap.style.display = 'block';
        submitBtn.disabled = true;
        progressBar.style.width = '0%';
        progressLabel.textContent = 'uploading...';

        xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable) {
                const pct = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = pct + '%';
                progressLabel.textContent = `uploading... ${pct}%`;
            }
        });

        xhr.addEventListener('load', () => {
            progressWrap.style.display = 'none';
            selectedFiles = []; selectedName.textContent = 'no files selected';
            fileInput.value = ''; submitBtn.disabled = true;
            try {
                const r = JSON.parse(xhr.responseText);
                if (r.success) {
                    const errMsg = r.errors?.length ? ` (${r.errors.length} failed)` : '';
                    showStatus(`${r.uploaded.length} clip(s) uploaded!${errMsg}`,
                               r.errors?.length ? 'error' : 'success');
                    loadClips();
                } else {
                    showStatus('Upload failed: ' + (r.message || 'unknown error'), 'error');
                }
            } catch {
                showStatus(`Upload failed: HTTP ${xhr.status}`, 'error');
            }
        });

        xhr.addEventListener('error', () => {
            progressWrap.style.display = 'none'; submitBtn.disabled = false;
            showStatus('Network error — server may be waking up. Wait 30s and retry.', 'error');
        });

        xhr.open('POST', `${SERVER}/upload-clip`);
        xhr.timeout = 10 * 60 * 1000;
        xhr.send(formData);
    });

    // ── Load Clips ───────────────────────────────────────────
    async function loadClips(attempt = 1) {
        const MAX = 10, RETRY = 8000;
        const grid = document.getElementById('clips-grid-all');
        if (attempt === 1) grid.innerHTML = '<div class="clips-empty">loading clips...</div>';
        else grid.innerHTML = `<div class="clips-empty">waking server... (${attempt}/${MAX})</div>`;

        try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 7000);
            const res  = await fetch(`${SERVER}/api/clips`, { signal: ctrl.signal });
            clearTimeout(t);
            const data = JSON.parse(await res.text());

            allClipsData = data.clips || [];
            grid.innerHTML = '';

            if (allClipsData.length === 0) {
                grid.innerHTML = '<div class="clips-empty">no clips yet</div>';
                buildTabBar([]);
                return;
            }

            // Build "all clips" view: group by month (across all users)
            const months = groupByMonth(allClipsData);
            renderMonthGroups(grid, months, true);  // showUploader=true

            // Build tab bar: one tab per unique uploader
            const uploaders = [...new Set(allClipsData.map(c => c.uploader || 'unknown'))];
            buildTabBar(uploaders);

            buildPlaylist();

        } catch (e) {
            console.warn(`Attempt ${attempt} failed:`, e.message);
            if (attempt < MAX) setTimeout(() => loadClips(attempt + 1), RETRY);
            else document.getElementById('clips-grid-all').innerHTML =
                '<div class="clips-empty">server took too long — refresh</div>';
        }
    }

    // ── Build clip card ──────────────────────────────────────
    function buildClipCard(clip, showUploader) {
        const filename = clip.filename || clip;
        const url      = clip.url || `${SERVER}/uploads/clips/${encodeURIComponent(filename)}`;
        const card     = document.createElement('div');
        card.className = 'clip-card';

        const video = document.createElement('video');
        video.controls = true; video.preload = 'metadata'; video.src = url;
        // Clicking card video also integrates with playlist
        video.addEventListener('play', () => {
            const idx = playlist.findIndex(p => p.video === video);
            if (idx !== -1 && idx !== playIdx) {
                playlist.forEach(p => { if (p.video !== video) p.video.pause(); });
                playIdx = idx;
                cpbPlay.textContent = '⏸';
                updateLabel();
            }
        });
        video.addEventListener('pause', () => { if (playlist[playIdx]?.video === video) cpbPlay.textContent = '▶'; });

        const info = document.createElement('div');
        info.className = 'clip-card-info';

        const displayName = filename.replace(/\.[^.]+$/, '');
        const nameEl = document.createElement('p');
        nameEl.className = 'clip-card-name';
        nameEl.textContent = displayName; nameEl.title = filename;
        info.appendChild(nameEl);

        // Uploader shown on card in "all clips" view
        if (showUploader && clip.uploader) {
            const uploaderEl = document.createElement('p');
            uploaderEl.className = 'clip-card-uploader';
            uploaderEl.textContent = clip.uploader;
            info.appendChild(uploaderEl);
        }

        // Date from filename or created_at
        const dateMatch = filename.match(/(\d{4})\.(\d{2})\.(\d{2})\s*-\s*(\d{2})\.(\d{2})\.(\d{2})/);
        if (dateMatch) {
            const [, yr, mo, dy, hr, min] = dateMatch;
            const d = document.createElement('p');
            d.className = 'clip-card-date';
            d.textContent = `${yr}-${mo}-${dy}  ${hr}:${min}`;
            info.appendChild(d);
        } else if (clip.created_at) {
            const d = document.createElement('p');
            d.className = 'clip-card-date';
            d.textContent = new Date(clip.created_at).toLocaleString();
            info.appendChild(d);
        }

        // Delete button — only for owner
        if (username && clip.uploader &&
            username.toLowerCase() === clip.uploader.toLowerCase() && clip.public_id) {
            const delBtn = document.createElement('button');
            delBtn.className   = 'clip-delete-btn';
            delBtn.textContent = '✕ delete';
            delBtn.addEventListener('click', async () => {
                if (!confirm(`Delete "${displayName}"?`)) return;
                try {
                    const r = await fetch(
                        `${SERVER}/api/clips/${encodeURIComponent(clip.public_id)}`,
                        { method: 'DELETE', headers: {'Content-Type':'application/json'},
                          body: JSON.stringify({ uploader: username }) }
                    );
                    const d = await r.json();
                    if (d.success) { showStatus('Clip deleted.', 'success'); loadClips(); }
                    else showStatus('Delete failed: ' + d.message, 'error');
                } catch (e) { showStatus('Delete error: ' + e.message, 'error'); }
            });
            info.appendChild(delBtn);
        }

        card.appendChild(video);
        card.appendChild(info);
        return card;
    }

    function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className   = `clips-status-msg ${type}`;
        clearTimeout(statusMsg._timer);
        statusMsg._timer = setTimeout(() => { statusMsg.className = 'clips-status-msg'; }, 7000);
    }

    loadClips();
</script>
</body>
</html>
