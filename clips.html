<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hatchat - Clips</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/public/icons/icon-192.png">
<body class="clips-page">

<header>
<div class="logo">hatchat - 1.0.0.7</div>
<nav>
<ul>
<li><a href="clips.html">clips</a></li>
<li><a href="index.html">homepage</a></li>
<li><a href="chat.html">hatchat</a></li>
<li><a href="settings.html">settings</a></li>
<li><a href="download.html">download</a></li>
</ul>
</nav>
</header>

<div class="clips-main">
<div id="clips-status" class="clips-status-msg"></div>

<div class="clips-theater" id="clips-theater" style="display:none">
<video class="theater-video" id="theater-video" preload="metadata"></video>
<div class="theater-controls">
<button class="tc-btn" id="tc-prev">⏮</button>
<button class="tc-btn" id="tc-play">▶</button>
<button class="tc-btn" id="tc-next">⏭</button>
<input type="range" class="tc-seek" id="tc-seek" min="0" max="100" value="0">
<span class="tc-time" id="tc-time">0:00 / 0:00</span>
<button class="tc-btn" id="tc-mute">🔊</button>
<input type="range" class="tc-vol" id="tc-vol" min="0" max="1" step="0.05" value="1">
<button class="tc-btn" id="tc-full">⛶</button>
<span class="tc-title" id="tc-title"></span>
</div>
</div>

<div class="clips-upload-section" id="drop-zone">
<h2>upload a clip</h2>
<p>nvidia clips only · mp4 · webm · mov</p>
<label class="clip-upload-label" for="clip-file-input">choose files</label>
<input type="file" id="clip-file-input" class="clip-file-input"
accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" multiple>
<button class="clip-submit-btn" id="clip-submit-btn" disabled>upload</button>
<span class="clip-selected-name" id="clip-selected-name">no files selected</span>

<div class="clip-upload-progress" id="clip-upload-progress">
<span id="clip-progress-label">uploading...</span>
<div class="clip-progress-bar-wrap">
<div class="clip-progress-bar" id="clip-progress-bar"></div>
</div>
</div>
</div>

<div class="clips-grid-section">
<div id="clips-grid-all">
<div class="clips-empty">loading clips...</div>
</div>
</div>
</div>

<script>

const SERVER = window.location.origin
const username = localStorage.getItem("chat_username")

let allClipsData=[]
let playlist=[]
let playIdx=0

const grid=document.getElementById("clips-grid-all")
const tvid=document.getElementById("theater-video")
const theater=document.getElementById("clips-theater")

function fmt(s){
s=Math.floor(s||0)
return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`
}

function loadTheaterClip(idx){
if(!playlist.length)return

playIdx=((idx%playlist.length)+playlist.length)%playlist.length
const clip=playlist[playIdx]

tvid.src=clip.url
tvid.play().catch(()=>{})

document.getElementById("tc-title").textContent=clip.filename
theater.style.display=""
}

document.getElementById("tc-play").onclick=()=>{
if(tvid.paused)tvid.play()
else tvid.pause()
}

document.getElementById("tc-prev").onclick=()=>loadTheaterClip(playIdx-1)
document.getElementById("tc-next").onclick=()=>loadTheaterClip(playIdx+1)

document.getElementById("tc-vol").oninput=e=>{
tvid.volume=e.target.value
}

document.getElementById("tc-mute").onclick=()=>{
tvid.muted=!tvid.muted
}

document.getElementById("tc-full").onclick=()=>{
if(tvid.requestFullscreen)tvid.requestFullscreen()
}

tvid.addEventListener("timeupdate",()=>{
const seek=document.getElementById("tc-seek")
const time=document.getElementById("tc-time")

if(!tvid.duration)return
seek.value=(tvid.currentTime/tvid.duration)*100
time.textContent=`${fmt(tvid.currentTime)} / ${fmt(tvid.duration)}`
})

document.getElementById("tc-seek").oninput=e=>{
if(tvid.duration)
tvid.currentTime=(e.target.value/100)*tvid.duration
}

tvid.onclick=()=>{
if(tvid.paused)tvid.play()
else tvid.pause()
}

function buildClipCard(clip){

const filename=clip.filename
const url=clip.url||`${SERVER}/uploads/clips/${encodeURIComponent(filename)}`

const card=document.createElement("div")
card.className="clip-card"

const thumb=document.createElement("div")
thumb.className="clip-thumb"

const video=document.createElement("video")

video.dataset.src=url
video.preload="none"
video.muted=true
video.playsInline=true
video.style="width:100%;height:100%;object-fit:cover"

thumb.appendChild(video)

const play=document.createElement("div")
play.className="clip-play-overlay"
play.innerHTML="▶"

play.onclick=(e)=>{
e.stopPropagation()
const idx=playlist.findIndex(c=>c.filename===clip.filename)
loadTheaterClip(idx)
}

thumb.appendChild(play)
card.appendChild(thumb)

const info=document.createElement("div")
info.className="clip-card-info"

const name=document.createElement("p")
name.className="clip-card-name"
name.textContent=filename.replace(/\.[^.]+$/,"")

info.appendChild(name)

if(clip.uploader){
const up=document.createElement("p")
up.className="clip-card-uploader"
up.textContent=clip.uploader
info.appendChild(up)
}

card.appendChild(info)

return card
}

function renderGrid(clips){

grid.innerHTML=""

if(!clips.length){
grid.innerHTML='<div class="clips-empty">no clips yet</div>'
return
}

clips.forEach(c=>{
grid.appendChild(buildClipCard(c))
})

playlist=[...clips]

lazyLoadVideos()
}

function lazyLoadVideos(){

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{

if(entry.isIntersecting){

const v=entry.target

if(!v.src){
v.src=v.dataset.src
}

observer.unobserve(v)

}

})
},{rootMargin:"300px"})

document.querySelectorAll("video[data-src]").forEach(v=>{
observer.observe(v)
})
}

async function loadClips(){

try{

grid.innerHTML='<div class="clips-empty">loading clips...</div>'

const res=await fetch(`${SERVER}/api/clips`)
const data=await res.json()

allClipsData=data.clips||[]

renderGrid(allClipsData)

}catch(e){

grid.innerHTML='<div class="clips-empty">failed to load clips</div>'

}

}

loadClips()

</script>
</body>
</html>
