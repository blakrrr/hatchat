<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hatchat - Clips</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/public/icons/icon-192.png">
</head>
<body class="clips-page">

<header>
  <div class="logo">hatchat - 1.0.0.7</div>
  <nav>
    <ul>
      <li><a href="clips.html">clips</a></li>
      <li><a href="index.html">homepage</a></li>
      <li><a href="chat.html">hatchat</a></li>
      <li><a href="settings.html">settings</a></li>
      <li><a href="download.html">download</a></li>
    </ul>
  </nav>
</header>

<div class="clips-main">
  <div id="clips-status" class="clips-status-msg"></div>

  <!-- Theater Mode -->
  <div class="clips-theater" id="clips-theater" style="display:none">
    <video class="theater-video" id="theater-video" preload="metadata"></video>
    <div class="theater-controls">
      <div class="tc-trim-wrap" title="Preview start offset from end">
        <span class="tc-trim-label">trim</span>
        <input type="range" class="tc-trim" id="tc-trim" min="0" max="5" step="1" value="5">
        <span class="tc-trim-val" id="tc-trim-val">60s</span>
      </div>
      <button class="tc-btn" id="tc-prev">⏮</button>
      <button class="tc-btn" id="tc-play">▶</button>
      <button class="tc-btn" id="tc-next">⏭</button>
      <input type="range" class="tc-seek" id="tc-seek" min="0" max="100" step="0.1" value="0">
      <span class="tc-time" id="tc-time">0:00 / 0:00</span>
      <button class="tc-btn" id="tc-loop">🔁</button>
      <button class="tc-btn" id="tc-shuffle">🔀</button>
      <button class="tc-btn" id="tc-mute">🔊</button>
      <input type="range" class="tc-vol" id="tc-vol" min="0" max="1" step="0.05" value="1">
      <button class="tc-btn" id="tc-full">⛶</button>
      <span class="tc-title" id="tc-title"></span>
    </div>
  </div>

  <!-- Upload -->
  <div class="clips-upload-section" id="drop-zone">
    <h2>upload a clip</h2>
    <p>nvidia clips only · mp4 · webm · mov · no size limit · last 60s kept · drag & drop or browse</p>
    <label class="clip-upload-label" for="clip-file-input">choose files</label>
    <input type="file" id="clip-file-input" class="clip-file-input" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" multiple>
    <button class="clip-submit-btn" id="clip-submit-btn" disabled>upload</button>
    <span class="clip-selected-name" id="clip-selected-name">no files selected</span>
    <div class="clip-upload-progress" id="clip-upload-progress">
      <span id="clip-progress-label">uploading...</span>
      <div class="clip-progress-bar-wrap">
        <div class="clip-progress-bar" id="clip-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="clips-tab-bar">
    <button class="clips-tab active" id="tab-all" onclick="switchTab('all')">all clips</button>
    <div class="clips-tab-users" id="tab-users"></div>
  </div>

  <!-- Grid -->
  <div class="clips-grid-section">
    <div id="clips-all-view"><div id="clips-grid-all"><div class="clips-empty">loading clips...</div></div></div>
    <div id="clips-user-view" style="display:none"><div id="clips-grid-user"></div></div>
  </div>
</div>

<script>
// API always lives on Render — GitHub Pages only serves static HTML.
// (Same fix that chat.html already has.)
const SERVER = 'https://averrgy-github-io.onrender.com';
const username = localStorage.getItem('chat_username') || null;
let allClipsData = [], playlist = [], playIdx = 0;
let activeTab = 'all', trimSecs = 60;

// ── Helper: color palette
const USER_PALETTE = ['#7c6af7','#e8724a','#4ab8e8','#6fcf6f','#e8d44a','#e84a8f','#4ae8b8','#e8a44a'];
const userColorMap = {};
let paletteIdx = 0;
function getUserColor(user){ if(!user||user==='unknown') return '#666'; if(!userColorMap[user]) userColorMap[user]=USER_PALETTE[paletteIdx++ % USER_PALETTE.length]; return userColorMap[user]; }

// ── Clip grid builder
function renderGrid(container, clips, showUploader){
  container.innerHTML='';
  if(!clips.length){ container.innerHTML='<div class="clips-empty">no clips</div>'; return; }

  clips.forEach(clip=>{
    const card = document.createElement('div');
    card.className='clip-card';
    card.style.borderColor=getUserColor(clip.uploader)+'44';

    const thumb = document.createElement('div');
    thumb.className='clip-thumb';

    const video = document.createElement('video');
    video.dataset.src = clip.url;
    video.preload='none';
    video.muted = true;
    video.style.cssText='width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
    thumb.appendChild(video);

    const overlay = document.createElement('div');
    overlay.className='clip-play-overlay'; overlay.innerHTML='▶';
    overlay.addEventListener('click', e=>{ e.stopPropagation(); loadTheaterClipByUrl(clip.url); });
    thumb.appendChild(overlay);

    card.appendChild(thumb);

    const info = document.createElement('div'); info.className='clip-card-info';
    const nameEl = document.createElement('p'); nameEl.className='clip-card-name'; nameEl.textContent=clip.filename.replace(/\.[^.]+$/,'');
    info.appendChild(nameEl);
    if(showUploader && clip.uploader){
      const uEl = document.createElement('p'); uEl.className='clip-card-uploader'; uEl.textContent=clip.uploader;
      uEl.style.color = getUserColor(clip.uploader);
      info.appendChild(uEl);
    }
    card.appendChild(info);
    container.appendChild(card);
  });

  lazyLoadVideos();
}

// ── Lazy load videos
function lazyLoadVideos(){
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const v = entry.target;
        if(!v.src) v.src = v.dataset.src;
        observer.unobserve(v);
      }
    });
  }, { rootMargin:'300px' });
  document.querySelectorAll('video[data-src]').forEach(v=>observer.observe(v));
}

// ── Theater player
const tvid = document.getElementById('theater-video');
function loadTheaterClipByUrl(url){
  tvid.src = url;
  tvid.load();
  tvid.play().catch(()=>{});
  document.getElementById('clips-theater').style.display='';
}

// ── Load clips
async function loadClips(){
  const grid = document.getElementById('clips-grid-all');
  grid.innerHTML='<div class="clips-empty">loading clips...</div>';
  try{
    const res = await fetch(`${SERVER}/api/clips`);
    const data = await res.json();
    allClipsData = data.clips || [];
    renderGrid(grid, allClipsData, true);

    const uploaders = [...new Set(allClipsData.map(c=>c.uploader||'unknown'))];
    buildTabBar(uploaders);
  }catch(e){
    console.error(e); grid.innerHTML='<div class="clips-empty">server error</div>';
  }
}

// ── Tab bar
function buildTabBar(uploaders){
  const tabUsers = document.getElementById('tab-users');
  tabUsers.innerHTML='';
  uploaders.sort().forEach(user=>{
    const btn = document.createElement('button');
    btn.className='clips-tab'; btn.dataset.user=user; btn.textContent=user; btn.style.color=getUserColor(user);
    btn.onclick = ()=>switchTab(user);
    tabUsers.appendChild(btn);
  });
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.clips-tab').forEach(b=>b.classList.remove('active'));
  if(tab==='all'){ document.getElementById('tab-all').classList.add('active'); renderGrid(document.getElementById('clips-grid-all'), allClipsData, true); }
  else { document.querySelector(`.clips-tab[data-user="${tab}"]`)?.classList.add('active');
    renderGrid(document.getElementById('clips-grid-user'), allClipsData.filter(c=>c.uploader===tab), false); }
}

loadClips();

// ── Upload handler ───────────────────────────────────────────────────────
const fileInput   = document.getElementById('clip-file-input');
const submitBtn   = document.getElementById('clip-submit-btn');
const selectedLbl = document.getElementById('clip-selected-name');
const progressWrap= document.getElementById('clip-upload-progress');
const progressBar = document.getElementById('clip-progress-bar');
const progressLbl = document.getElementById('clip-progress-label');
const dropZone    = document.getElementById('drop-zone');

let pendingFiles = [];

function setFiles(files) {
  pendingFiles = Array.from(files).filter(f => /\.(mp4|webm|mov)$/i.test(f.name));
  if (pendingFiles.length === 0) {
    selectedLbl.textContent = 'no valid files selected';
    submitBtn.disabled = true;
  } else {
    selectedLbl.textContent = pendingFiles.length === 1 ? pendingFiles[0].name : `${pendingFiles.length} files selected`;
    submitBtn.disabled = false;
  }
}

fileInput.addEventListener('change', e => setFiles(e.target.files));

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  setFiles(e.dataTransfer.files);
});

submitBtn.addEventListener('click', async () => {
  if (!pendingFiles.length) return;
  if (!username) { document.getElementById('clips-status').textContent = 'you must be logged in to upload'; return; }
  submitBtn.disabled = true;
  progressWrap.style.display = 'block';
  let done = 0;

  for (const file of pendingFiles) {
    progressLbl.textContent = `uploading ${file.name} (${done + 1}/${pendingFiles.length})…`;
    progressBar.style.width = `${Math.round((done / pendingFiles.length) * 100)}%`;
    try {
      const fd = new FormData();
      fd.append('clip', file);
      fd.append('uploader', username);
      const res  = await fetch(`${SERVER}/upload-clip`, { method: 'POST', body: fd });
      const data = await res.json();
      if (!data.success) console.warn('Upload failed for', file.name, data.message);
    } catch(e) { console.error('Upload error:', e); }
    done++;
  }

  progressBar.style.width = '100%';
  progressLbl.textContent = 'done! reloading clips…';
  pendingFiles = [];
  fileInput.value = '';
  selectedLbl.textContent = 'no files selected';
  submitBtn.disabled = false;
  setTimeout(() => { progressWrap.style.display = 'none'; progressBar.style.width = '0'; }, 1500);
  await loadClips();
});
</script>
</body>
</html>
